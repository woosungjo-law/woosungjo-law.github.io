<script id="col-data" type="application/json">{"byline": "조우성", "cards": {"cards": [{"body": "전략계획 논쟁을 정리한 연구 노트. 계획을 세울 것인가 말 것인가가 아니라 계획이 새 소식을 받아들이는가가 물음이다. 돕는 때와 가리는 때를 나눈다.", "kind": "cover", "small": "연구 노트 · 전략 · 2019 대 1994", "title": "계획이 두꺼워질수록 전략은 얇아진다"}, {"body": "2019년 조지·워커·몬스터는 31편의 실증과 87개의 겹침을 모아 셈했다. 계획은 성과에 좋은 쪽으로 중간쯤 가는 영향을 준다. 무엇을 버렸는지 남기는 장치가 핵심이다.", "kind": "compare", "small": "메타분석 대 1994년 비판", "title": "돕는 때 대 가리는 때"}, {"body": "계획은 멋진 앞날을 적는 일이 아니다. 무엇을 먼저 하고 무엇을 버렸는지 남기고, 뒤의 손질을 앞의 판단과 견주게 한다. 절차가 공식으로 돌 때 사이가 더 단단해진다.", "kind": "point", "small": "조지·워커·몬스터(2019)", "title": "조율의 바닥이 된다"}, {"body": "앞날을 맞힐 수 있다는 믿음, 그리는 사람과 사는 사람의 나눔, 살아 있는 판단을 굳은 절차로 재단하기가 길을 잃게 한다. 분석을 잘하는 것과 꿰뚫는 것은 다른 일이다.", "kind": "point", "small": "민츠버그(1994)", "title": "방패가 될 수 있다"}, {"body": "계획서에 틀렸음을 알리는 신호를 함께 적는다. 달성률뿐 아니라 계획 밖 소식과 기회를 함께 본다. 고친 사람에게 낙인을 찍지 않고 고친 까닭을 남긴다.", "kind": "close", "title": "오늘의 점검"}], "source_line": "George · Walker · Monster (2019) · Mintzberg (1994)"}, "col_id": "LR-P-087", "col_type": "대립형", "date": "2026-10-07", "kicker": "연구 노트 · 전략", "summary": {"headline": "계획이 새 소식을 받아들이는가", "keypoints": ["프레임 연구는 31편·87개의 겹침을 모아 계획의 성과를 확인했다.", "반증 논문은 앞날을 맞힐 수 있다는 믿음과 형식화의 함정을 짚었다.", "계획은 조율의 바닥이 되기도 하고 현실을 가리는 방패가 되기도 한다.", "틀렸음을 알리는 신호와 밖에 생긴 소식을 함께 보는 것이 먼저다."], "lede": "전략계획 논쟁의 물음은 세울 것인가 말 것인가가 아니라 새 소식을 받아들이는가입니다. 2019년 조지와 워커와 몬스터는 돕는 때를 셈으로 보였고, 1994년 민츠버그는 가리는 때를 경고했습니다.", "pull_quote": "흐름을 읽는 통로가 막히면 문서는 두꺼워지고 눈은 얇아진다.", "sections": [{"body": "31편의 실증연구에서 건진 87개의 겹침을 한데 모아 셈한 결과, 계획은 성과에 좋은 쪽으로 중간쯤 가는 영향을 줍니다. 절차가 공식으로 돌고 효과를 잴 때 사이가 더 단단합니다.", "h": "프레임: 셈으로 본 돕는 때"}, {"body": "앞날을 맞힐 수 있다는 믿음, 그리는 사람과 사는 사람의 나눔, 살아 있는 판단을 굳은 절차로 재단하기가 길을 잃게 합니다. 분석과 통찰은 다른 일입니다.", "h": "반증: 가리는 때의 경고"}, {"body": "한쪽은 돕는 때를, 다른 쪽은 가리는 때를 다룹니다. 지킴율이 판단보다 높은 점수를 받고 밖에 생긴 소식을 들고 오는 사람이 방해꾼이 되면 계획은 전략을 가립니다.", "h": "어긋남의 자리"}, {"body": "틀렸음을 알리는 신호를 계획서와 함께 적습니다. 달성률뿐 아니라 밖의 소식과 기회를 보고, 고친 까닭을 남깁니다.", "h": "바뀌는 질문"}], "sources": ["Bert George, Richard M. Walker \u0026 Joost Monster (2019) Does Strategic Planning Improve Organizational Performance? A Meta-Analysis", "Henry Mintzberg (1994) Rethinking Strategic Planning Part I: Pitfalls and Fallacies"]}, "title": "계획이 두꺼워질수록 전략은 얇아진다"}</script>
<script>
window.TPL={"kpTitle": "남겨 둘 문장", "splitLede": true, "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
</script>
