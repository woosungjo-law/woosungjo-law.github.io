<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

<script id="col-data" type="application/json">{"col_id": "LR-P-197", "title": "사고 뒤에 사람을 세우지 않으면 배운 것도 남지 않는다", "col_type": "대립형", "kicker": "안전 · 두 번째 피해자", "byline": "조우성", "date": "2026-11-26", "summary": {"headline": "지원은 배려가 아니라 학습의 전제다", "lede": "사고 대응 절차에 연루된 직원의 자리는 없다. 그 공백을 메우지 않으면 보고는 줄고 침묵이 늘어난다.", "sections": [{"h": "세 단계의 책임", "body": "곁을 지키고 업무를 조정하는 첫 단계, 사건의 의미를 함께 정리하는 두 번째 단계, 필요할 때 전문가로 넘기는 세 번째 단계. 지원은 예외적 배려가 아니라 기본 책임이다."}, {"h": "원한 것과 받은 것", "body": "실증 연구 99편을 종합해 보니 의료진이 원한 것은 동료 지지와 실질적 안내, 전문 심리 지원이었다. 실제로 가장 많이 받은 것은 관리자 지지와 절차적 모임이었다."}, {"h": "근거 없는 확산", "body": "효과를 본 11편의 결과는 엇갈렸고 비교군도 드물었다. 그런데 동료 지지 프로그램은 빠르게 퍼졌다. 프로그램의 수는 회복의 증거가 아니다."}, {"h": "준비의 값", "body": "온라인 9주 과정을 일선 의료진 266명과 관리자 26명이 평가했다. 10점 만점에 9점에 가까운 평점이 나왔다. 사건 전에 무엇을 겪을지 아는 것만으로 출발점이 달라진다."}], "keypoints": ["조사 통보보다 안부 확인이 먼저다", "지원은 단계로 설계한다", "프로그램 수와 회복은 다른 지표다", "쉴 권리와 업무 조정을 함께 준다", "요구가 채워졌는지 묻는다"], "pull_quote": "사람이 서 있어야 사실도 말할 수 있다.", "sources": ["Seys 등 (2013) International Journal of Nursing Studies 50(5) 678–687", "Simms-Ellis 등 (2025) BMJ Open 15(2) e087512", "Mira 등 (2017) Journal of Medical Internet Research 19(6) e203"]}, "cards": {"cards": [{"kind": "cover", "title": "일정표에 없는 사람", "body": "사고가 나면 환자 조치와 원인 분석과 대책이 움직인다. 그 일정표에 사고에 연루된 직원은 없다. 조사 대상이 되거나 스스로를 탓하는 동안 그 사람은 조용히 무너진다.", "small": "출발점"}, {"kind": "point", "title": "세 단계", "body": "곁을 지키고 업무를 조정하는 첫 단계, 사건의 의미를 함께 정리하는 두 번째, 필요할 때 전문가로 넘기는 세 번째. 단계가 있다는 것은 같은 처방을 쓰지 않는다는 뜻이다.", "small": "Seys 등 (2013)"}, {"kind": "compare", "title": "원함과 받음", "body": "원함: 동료 지지, 실질적 안내, 전문 심리 지원||받음: 관리자 지지, 일정한 형태의 디브리핑. 겹치면서도 어긋났다", "small": "Simms-Ellis 등 (2025)"}, {"kind": "point", "title": "근거의 두께", "body": "실증 연구 99편 중 효과를 본 것은 11편이었고 결과는 엇갈렸다. 비교군과 무작위 배정이 드물었다. 그런데도 프로그램은 늘었다.", "small": "효과 검토"}, {"kind": "point", "title": "준비 교육", "body": "9주 온라인 과정을 의료진 266명과 관리자 26명이 평가했다. 6점 미만은 1퍼센트가 되지 않았다. 사건 뒤에 쓸 자원을 미리 알게 하는 일이다.", "small": "Mira 등 (2017)"}, {"kind": "close", "title": "세 가지 질문", "body": "조사 항목 다음 줄에 지원 항목이 있는가. 첫 연락은 통보인가 안부인가. 프로그램 수가 아니라 요구가 채워졌는지 묻고 있는가.", "small": "점검"}], "source_line": "Seys 등 (2013) · Simms-Ellis 등 (2025) · Mira 등 (2017) 토픽 재구성"}}</script>
<script>
window.TPL={"kpTitle": "이야기에서 건진 것", "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
</script>
