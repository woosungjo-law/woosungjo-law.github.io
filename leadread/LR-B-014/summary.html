<script id="col-data" type="application/json">{"byline": "조우성", "cards": {"cards": [{"body": "유발 하라리 《사피엔스》를 읽고 정리한 연구 노트. 몸이 닫은 문인지 시대가 닫은 문인지를 가르고, 울타리를 아는 눈으로 경계를 넓히는 법을 살핀다.", "kind": "cover", "small": "연구 노트 · 삶 · 2011", "title": "막는 것은 몸이 아니라 문화다"}, {"body": "생물학은 넓은 가능성을 용인하는 토양이고, 문화는 실현해도 되는 것과 안 되는 것을 그어 놓는 울타리다. 못하는 것과 하지 않게 된 것은 겉으로 똑같이 보인다.", "kind": "point", "small": "경계의 구분", "title": "토양과 울타리"}, {"body": "생물학은 허용하고, 문화는 금지한다. 이 문장은 재단이 아니라 관찰이다. 같은 몸인데도 시대에 따라 당연한 일이 달라지는 이유가 여기 있다.", "kind": "quote", "small": "《사피엔스》(2011) · 필자 번역", "title": "하라리의 경계"}, {"body": "울타리를 만드는 쪽은 질서를 얻고, 안에서 사는 쪽은 편안함을 얻는다. 울타리임을 알면서 책임 있게 움직이는 자리가 있다. 자각은 몸의 몫과 문화의 몫을 가려 준다.", "kind": "point", "small": "세 번째 자리", "title": "자각이 가려 준다"}, {"body": "안 되는 이유를 묻는 대신 누가 언제 그 일을 안 되는 쪽에 놓았는지를 묻는다. 그 질문에 답할 때만 울타리를 고칠 수 있다. 매일의 안 된다는 말을 다시 묻는 것이 시작이다.", "kind": "close", "title": "다시 묻는 일"}], "source_line": "유발 하라리 (2011) 《사피엔스》 Sapiens"}, "col_id": "LR-B-014", "col_type": "인용사색형", "date": "2026-09-30", "kicker": "연구 노트 · 삶", "summary": {"headline": "울타리를 아는 눈이 문을 연다", "keypoints": ["생물학은 넓은 가능성을 용인하고, 문화는 그중 일부만 허락한다.", "안 된다는 느낌은 몸의 보고가 아니라 이야기의 보고일 수 있다.", "울타리임을 알면서 책임 있게 움직이는 자리가 있다.", "누가 언제 그 일을 안 되는 쪽에 놓았는지를 물어야 고칠 수 있다."], "lede": "유발 하라리의 《사피엔스》에서 가능성의 경계는 몸이 아니라 문화가 긋는다. 이 글은 한 문장을 붙들고 한계의 주인이 누구인지를 가려 본다.", "sections": [{"body": "하라리는 인간의 가능성을 가르는 선이 어디에 있는지 묻고, 생물학은 허용하고 문화는 금지한다고 답한다. 몸이 닫은 문인지 시대가 닫은 문인지를 가르는 문장이다.", "h": "경계에 관한 한 문장"}, {"body": "생물학은 넓은 스펙트럼을 용인하는 토양이고, 문화는 실현해도 되는 것과 안 되는 것을 긋는 울타리다. 못하는 것과 하지 않게 된 것은 겉으로 똑같이 보인다.", "h": "토양과 울타리"}, {"body": "울타리를 만드는 쪽은 질서를 얻고, 안에서 사는 쪽은 편안함을 얻는다. 울타리임을 알면서 책임 있게 움직이는 세 번째 자리가 있다.", "h": "세 번째 자리"}, {"body": "안 되는 이유 대신 누가 언제 그 일을 안 되는 쪽에 놓았는지를 묻는다. 그 질문에 답할 때만 울타리를 고칠 수 있다.", "h": "다시 묻는 일"}], "pull_quote": "느낌의 출처를 묻기 전에는 한계의 주인도 알 수 없다.", "sources": ["유발 하라리 (2011) 《사피엔스》 Sapiens — 도서"]}, "title": "막는 것은 몸이 아니라 문화다"}</script>
<script>
window.TPL={"kpTitle": "남겨 둘 문장", "splitLede": true, "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
</script>
