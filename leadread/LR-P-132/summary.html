<meta property="og:description" content="새 정보는 가까운 사이가 아니라 먼 사이에서 온다. 그런데 그 먼 연결이 어려운 일을 옮기는 데는 병목이 된다. 다리를 놓는 일과 다리 위를 건너는 일이 왜 다른 설계인지가 여기서 갈린다.">

<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

/* S4 체크리스트형 — 페이퍼화이트 & 틸 / 산세리프 / 체크박스 */
:root{--bg:#fafaf6;--ink:#1a2226;--mute:#5f6b70;--acc:#0e6b6b;--line:#d9ddd6;--soft:#eef2ee;--head:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif;--body:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif;--sans:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1416;--ink:#e5eceb;--mute:#93a3a3;--acc:#4fc0b6;--line:#26353a;--soft:#141f22}}
body{font-size:16.5px;line-height:1.8}
.page{max-width:780px;padding:32px 20px 80px}
.kicker{display:inline-block;align-self:flex-start;background:var(--acc);color:var(--bg);padding:4px 10px;letter-spacing:.06em;font-size:12px;border-radius:2px;margin-bottom:16px}
.hd{padding-bottom:26px}

.kp{order:2;margin:0 0 34px;padding:22px 18px 10px;background:var(--soft);border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:4px}
.kp-t{font-size:15px;font-weight:800;margin-bottom:6px}
.kp-t::after{content:" · 눌러서 확인";font-weight:500;font-size:12px;color:var(--mute)}
.kp li{display:flex;gap:14px;align-items:flex-start;padding:13px 4px;border-top:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
.kp li:first-child{border-top:0}
.kp li:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.kp-n{flex:none;position:relative;width:24px;height:24px;margin-top:2px;border:2px solid var(--acc);border-radius:5px;font-size:0;background:var(--bg);transition:background .15s}
.kp-n::after{content:"";position:absolute;left:6px;top:1.5px;width:6px;height:11px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .15s}
.kp li[aria-checked=true] .kp-n{background:var(--acc)}
.kp li[aria-checked=true] .kp-n::after{transform:rotate(45deg) scale(1)}
.kp li[aria-checked=true] .kp-x{color:var(--mute)}
.kp-x{font-weight:600;line-height:1.65}
.secs{order:3}
.sec{display:grid;grid-template-columns:52px 1fr;column-gap:14px;padding:22px 0;border-top:1px solid var(--line)}
.sec .num{grid-row:1/span 2;font-weight:800;font-size:34px;line-height:1;letter-spacing:-.04em;color:var(--acc);opacity:.9;padding-top:2px}
.sec h2{font-weight:800;font-size:clamp(18px,3vw,21px);line-height:1.45;letter-spacing:-.02em;margin-bottom:8px}
.ft{margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
@media (min-width:820px){
  .page{padding:64px 32px 110px}
  .kp{padding:28px 30px 14px}
  .sec{grid-template-columns:76px 1fr;padding:28px 0}
  .sec .num{font-size:48px}
  .sec-body{font-size:17px}
}
</style>

<script id="col-data" type="application/json">{"col_id": "LR-P-132", "title": "먼 연결은 찾는 일을 빠르게 하고 옮기는 일을 느리게 한다", "col_type": "대립형", "kicker": "논문 대립 · 약한 연결", "byline": "조우성", "date": "2026-11-12", "summary": {"headline": "찾는 일과 옮기는 일은 다른 일이고, 필요한 연결도 다르다", "lede": "새 정보는 가까운 사이가 아니라 먼 사이에서 온다. 그런데 그 먼 연결이 어려운 일을 옮기는 데는 병목이 된다. 다리를 놓는 일과 다리 위를 건너는 일이 왜 다른 설계인지가 여기서 갈린다.", "sections": [{"h": "프레임 · 다리는 약한 연결만 된다", "body": "가까운 사이는 아는 사람이 겹치니 같은 이야기를 돌려 받는다. 가끔 만나는 지인은 서로 다른 세계에 발을 두고 있어 겹치지 않는 소식을 들고 온다. 새 소식이 필요하면 가까운 팀을 더 모으지 말고 먼 연결을 늘려야 한다."}, {"h": "반증 · 옮기는 일은 다른 힘을 쓴다", "body": "대형 전자 기업의 41개 사업부 120개 프로젝트를 추적한 결과, 약한 연결은 지식을 찾는 수색에는 도움이 됐다. 그러나 옮겨 와서 쓰는 단계에서는 복잡한 지식일수록 발목을 잡았다. 복잡한 지식은 자주 만나 깊이 얽힌 사이에서만 옮겨졌다."}, {"h": "두 처방은 함께 쓸 수 있다", "body": "찾을 때는 멀리 손을 뻗고, 옮길 때는 가까이 붙는다. 수색의 성공을 이전의 성공으로 착각하지 않는 것이 두 연구의 접점이다. 다리를 놓는 일과 다리 위를 건너는 일은 다른 설계다."}], "keypoints": ["다리 역할은 강한 연결이 맡을 수 없고 약한 연결만 맡는다", "약한 연결은 찾는 일을 빠르게 하고 옮기는 일을 느리게 한다", "지식의 복잡도를 재지 않으면 연결의 강도 선택이 운이 된다", "도구가 다르면 같은 도면도 다른 지식이 된다", "수색의 성공을 이전의 성공으로 착각하면 통합의 비용으로 돌려받는다"], "pull_quote": "찾을 때는 멀리 손을 뻗고, 옮길 때는 가까이 붙는다.", "sources": ["Granovetter, M. S. (1973) The Strength of Weak Ties — American Journal of Sociology 78(6)", "Hansen, M. T. (1999) The Search-Transfer Problem — Administrative Science Quarterly 44(1)"]}, "cards": {"cards": [{"kind": "cover", "title": "다리는 오직 약한 연결", "body": "가까운 사이는 서로 아는 사람이 겹쳐 같은 소식을 돌려 받는다. 먼 지인은 다른 세계의 입구가 되어, 겹치지 않는 소식을 들고 온다.", "small": "프레임: Granovetter (1973) · 반증: Hansen (1999)"}, {"kind": "point", "title": "찾는 일과 옮기는 일", "body": "약한 연결은 다른 사업부의 쓸 만한 지식을 찾는 수색에 도움이 됐다. 찾아온 지식을 써서 만드는 단계에서는 복잡할수록 발목을 잡았다."}, {"kind": "compare", "title": "새 소식과 어려운 일", "body": "한쪽은 먼 연결이 새 소식을 가져온다고 보고, 다른 쪽은 어려운 일을 옮기지 못한다고 본다. 찾는 일과 옮기는 일은 다른 일이다."}, {"kind": "point", "title": "옮겨지지 않은 규칙", "body": "구버전 도구와 신버전 도구가 뒤섞이면 같은 도면도 다른 지식이 된다. 배선의 규칙이 버전 사이를 건너지 못했고, 기체는 2년 늦게 인도됐다."}, {"kind": "close", "title": "남는 질문", "body": "지금 조직에 놓인 다리는 수색용인가, 이전용인가. 이전용이라면 그 위에 복잡한 지식이 오 <script>
window.TPL={"kpTitle": "체크리스트", "checkable": true, "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
</script>
