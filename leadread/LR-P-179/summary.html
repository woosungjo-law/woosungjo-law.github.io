<script id="col-data" type="application/json">{"col_id": "LR-P-179", "title": "선행이 다음 판단의 면허가 될 때", "col_type": "대립형", "kicker": "윤리 · 지속", "byline": "조우성", "date": "2026-11-25", "summary": {"headline": "윤리적 리더는 선행을 면죄부로 쓰지 않는 사람이다", "lede": "좋은 행동을 많이 한 리더가 다음 날 느슨해질 수 있다. 소진과 도덕적 신용감을 보는 연구와, 그 면허가 언제 작동하는지를 묻는 연구를 나란히 놓는다.", "sections": [{"h": "선행의 대가", "body": "전날 윤리적 행동이 많았던 리더일수록 다음 날 학대적 행동이 늘었다. 자기통제로 소진되는 길과 이미 충분히 잘했다는 신용감이 사이에 있었다. 윤리를 의지에만 맡기면 지속되지 않는다."}, {"h": "면허의 경계", "body": "이전 선행은 모호한 잘못을 관대하게 읽게 할 수 있지만 모든 위반을 용서하지는 않는다. 노골적인 위반은 선행을 위선으로 읽게 만든다. 동기와 해석이 결과를 가른다."}, {"h": "앞과 뒤", "body": "하나는 리더 내부의 소진을 보고 다른 하나는 면허가 멈추는 조건을 본다. 소진은 문을 열고 해석 기준은 그 문을 닫는다. 선행의 양이 아니라 같은 기준의 적용이 관건이다."}], "keypoints": ["윤리적 행동도 자원을 소모한다", "도덕적 신용감이 다음 판단을 느슨하게 만든다", "선행이 자동으로 위반을 용서해 주지는 않는다", "평판은 안전장치가 아니라 시험 대상이다"], "pull_quote": "윤리는 한 번의 결단이 아니라 좋은 결정을 반복하게 하는 리듬이다.", "sources": ["Lin, Ma \u0026 Johnson (2016) When ethical leader behavior breaks down — 소스대장 140행", "Wang \u0026 Chan (2019) Ethical leadership and follower reactions to ambiguous transgressions — 소스대장 140행"]}, "cards": {"cards": [{"kind": "cover", "title": "선행 뒤의 날", "body": "공정하고 원칙을 설명하는 리더는 신뢰를 높이지만 그 행동 자체가 자원을 쓴다. 선행이 쌓일수록 다음 판단이 느슨해질 수 있다. 수혜자가 아니라 수행자를 봐야 하는 이유다.", "small": "윤리의 지속"}, {"kind": "point", "title": "두 경로", "body": "전날 윤리적 행동이 많았던 리더일수록 다음 날 학대적 행동이 늘었다. 감정 조절로 소진되는 길과 이미 충분히 잘했다는 신용감. 저녁의 폭발은 개인만의 문제가 아니다.", "small": "Lin 등 (2016)"}, {"kind": "point", "title": "언제 멈추는가", "body": "이전 선행은 모호한 잘못을 관대하게 읽게 할 수 있지만 노골적 위반은 오히려 위선으로 보인다. 동기와 해석이 결과를 가른다. 면허가 작동하는 조건을 따져야 한다.", "small": "Wang \u0026 Chan (2019)"}, {"kind": "compare", "title": "문을 열고 닫기", "body": "소진: 윤리가 의지에만 기대면 문이 열린다||기준: 같은 원칙을 적용하면 그 문이 닫힌다. 하나는 위험의 원인이고 다른 하나는 위험의 조건이다.", "small": "갈림"}, {"kind": "point", "title": "품성은 반복", "body": "윤리는 한 번의 결단이 아니라 반복되는 선택의 습관이다. 평판은 품성의 증명이 아니라 시험의 출발점이다. 선행을 자랑할수록 다음 판단을 더 자주 점검해야 한다.", "small": "아리스토텔레스의 렌즈"}, {"kind": "close", "title": "한 가지 점검", "body": "피로한 날에도 독립 검토가 작동하 <script>
window.TPL={"kpTitle": "남겨 둘 문장", "splitLede": true, "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {

      if (CFG.checkable) {

        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');

          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');

    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');

    sd.appendChild(ul);

  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));

  document.body.setAttribute('data-ready', '1');
})();
