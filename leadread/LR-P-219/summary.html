<script id="col-data" type="application/json">{"col_id": "LR-P-219", "title": "통합이 빠를수록 시너지는 늦게 온다", "col_type": "대립형", "kicker": "돈 · 인수합병", "byline": "조우성", "date": "2026-11-28", "summary": {"headline": "통제의 양이 아니라 목적이 문제다", "lede": "인수 뒤 시너지는 거래에서 생기지 않는다. 문제는 통합의 속도다. 한 연구는 계획된 구조가 값을 회수한다고 보고, 다른 연구는 그 구조가 산 것을 먼저 없앨 수 있다고 본다.", "sections": [{"h": "통합이 가치를 만든다", "body": "하스페스라그와 제미슨은 자율성과 상호의존이라는 두 축으로 흡수와 공생을 가른다. 어느 쪽이든 계획된 일정과 전담 조직과 지표 통일이 전제다. 리더의 임무는 통제권 확보가 된다."}, {"h": "모멘텀이 식는 자리", "body": "그레브너가 본 예상 밖의 가치는 하향식 계획에서 나오지 않았다. 자율성을 지킨 리더들의 자발적 만남과 즉흥적 실험에서 나왔다. 프로세스가 통일되는 순간 민첩성은 식었다."}, {"h": "무엇을 사려 했는가", "body": "강도를 정하기 전에 목적을 물어야 한다. 기존 사업을 키우려면 흡수가 맞고, 새 동력을 얻으려면 자원을 대는 쪽이 맞다. 같은 통합이 목적에 따라 정반대가 된다."}, {"h": "지양의 겹", "body": "보존하면서 극복하는 일이 통합에도 있다. 본사의 자원은 살리고 낡은 통제는 버린다. 지워서 하나가 되는 것이 아니라 셋째 방식을 만드는 일이다."}], "keypoints": ["시너지는 거래가 아니라 통합 설계에서 온다", "자발성은 통제 강도에 반비례한다", "통합의 목적이 강도를 정한다", "예상 밖의 가치는 회의록 밖에서 생긴다", "무엇을 샀는지 먼저 묻는다"], "pull_quote": "통합의 속도를 올리는 일과 값을 치르고 산 것을 지키는 일은 같은 방향이 아니다.", "sources": ["Haspeslagh \u0026 Jemison (1991) Managing Acquisitions", "Graebner (2004) Momentum and Serendipity — Academy of Management Journal"]}, "cards": {"cards": [{"kind": "cover", "title": "서명 다음의 몇 달", "body": "인수의 성패는 계약서에 서명한 날이 아니라 그 뒤의 속도 조절에서 갈린다. 빠른 통합이 값을 회수한다는 믿음과 자발성을 지켜야 한다는 반론이 부딪힌다.", "small": "출발점"}, {"kind": "point", "title": "두 축의 설계", "body": "하스페스라그와 제미슨은 자율성과 상호의존의 조합으로 흡수와 공생을 가른다. 어느 쪽이든 계획된 일정과 전담 조직과 지표 통일이 전제다.", "small": "Haspeslagh \u0026 Jemison (1991)"}, {"kind": "compare", "title": "계획과 자발성", "body": "하향식 계획이 값을 회수한다||자율성이 예상 밖의 값을 만든다. 보고를 강제하는 순간 민첩성은 식고 창의적인 사람부터 떠난다", "small": "Graebner (2004)"}, {"kind": "point", "title": "목적이 강도를 정한다", "body": "기존 사업을 키우려는 인수라면 중복을 걷어내는 흡수가 맞다. 새 동력을 얻으려는 인수라면 본사 방식을 이식하는 대신 자원을 대는 쪽이 맞다.", "small": "적용"}, {"kind": "close", "title": "남은 결정 권한", "body": "피인수 리더에게 아직 남아 있는 결정 권한을 적어 보라. 통합 지표가 중복 제거를 재는지 새 결합을 재는지도 함께 확인한다.", "small": "점검"}], "source_line": "Haspeslagh \u0026 Jemison (1991) · Graebner (2004) 토픽 재구성"}}</script>
<script>
window.TPL={"kpTitle": "남겨 둘 문장", "splitLede": true, "srcTitle": "출처"};
(function () {

    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }

  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');

    var ol = el('ol');
