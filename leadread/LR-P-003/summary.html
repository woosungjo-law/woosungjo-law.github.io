<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

:root{--bg:#f1f3ea;--ink:#1c2a22;--mute:#5d6b60;--acc:#1f4d3a;--clay:#a4552b;--line:#1f4d3a;--soft:#e4e9da;--head:"Nanum Myeongjo","Noto Serif KR",serif;--body:"Nanum Myeongjo","Noto Serif KR",serif;--sans:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif}

<script id="col-data" type="application/json">{"byline": "조우성", "cards": {"cards": [{"body": "결정 논쟁 두 편을 읽고 정리한 연구 노트. 경험의 느낌을 믿을 자격이 있는지 묻는다. 이 글이 던지는 것은 믿음이 아니라 가리는 법이다. 확신의 크기가 아니라 환경과 절차다.", "kind": "cover", "small": "연구 노트 · 판단", "title": "확신의 강도는 판단의 질과 무관하다"}, {"body": "전문가의 느낌은 조건이 갖춰진 세계에서 작동한다. 환경이 규칙적이고 되풀이 속에서 넉넉한 연습과 빠른 되먹임이 이어져야 한다. 자격부터 가리라는 처방이다.", "kind": "point", "small": "2009년 논문", "title": "느낌이 먹히는 세계"}, {"body": "처음 숫자가 기준점이 되고 쓴 돈이 새 판단을 붙잡는다. 경륜이 깊을수록 확신이 함정의 신호를 덮는다. 처방은 마음이 아니라 절차에 있다. 방어막을 밖에 세우라는 것이다.", "kind": "point", "small": "1998년 글", "title": "함정이 지나는 통로"}, {"body": "앞의 처방은 안쪽에 있고 뒤의 처방은 바깥에 있다. 느낌이 먹히는 세계인지 확인하고, 스스로 발견을 기대 말고 절차가 걸러주게 한다. 둘은 경계를 나눈다.", "kind": "compare", "small": "서로 다른 층", "title": "갈리는 곳"}, {"body": "마음은 거울처럼 비추지 않고 기울기를 더해 비춘다. 부족과 동굴, 시장과 극장이라는 네 우상이 그 이름이다. 고치는 대신 지나갈 절차를 세운다. 필자가 이어 붙인 생각이다.", "kind": "point", "small": "필자의 이어 붙임", "title": "베이컨의 우상"}, {"body": "결정의 세계는 규칙적인가 되먹임은 빠른가 먼저 묻는다. 결정 전에 실패를 가정하고 까닭을 적어 둔다. 확신의 크기가 아니라 환경과 절차가 가른다. 절차가 확신보다 먼저 선다.", "kind": "close", "title": "앉기 전 점검"}], "source_line": "Daniel Kahneman · Gary Klein (2009) Conditions for Intuitive Expertise / John Hammond · Ralph Keeney · Howard Raiffa (1998) The Hidden Traps in Decision Making"}, "col_id": "LR-P-003", "col_type": "대립형", "date": "2026-09-30", "kicker": "연구 노트 · 판단", "summary": {"headline": "믿음의 자격을 먼저 가린다", "keypoints": ["느낌은 조건이 갖춰진 세계에서만 믿을 만하다.", "처음 숫자와 쓴 돈이 새 판단을 붙잡는다.", "확신이 클수록 함정의 신호가 덮인다.", "결정 전에 실패를 가정하고 까닭을 적어 둔다."], "lede": "결정 논쟁의 핵심은 경험을 믿을지가 아니라 믿음의 자격을 가리는 법입니다. 한쪽은 느낌이 먹히는 세계를 묻고, 다른 쪽은 마음의 함정을 절차로 걸러내라고 말합니다.", "pull_quote": "가르는 것은 확신의 크기가 아니라 환경과 절차다.", "sections": [{"body": "전문가의 느낌은 조건이 갖춰진 세계에서 진짜로 작동한다. 환경이 규칙적이고 되풀이 속에서 넉넉한 연습과 빠른 되먹임이 이어져야 한다. 느낌을 믿기 전에 훈련된 세계인지를 가린다.", "h": "느낌이 먹히는 세계"}, {"body": "처음 들은 숫자가 기준점이 되고 쓴 돈과 시간이 새 판단을 붙잡는다. 경륜이 깊고 총명할수록 확신이 함정의 신호를 덮는다. 처방은 마음속이 아니라 절차에 있다.", "h": "함정이 지나는 통로"}, {"body": "앞의 처방은 안쪽에 있고 뒤의 처방은 바깥에 있다. 느낌이 먹히는 세계인지 확인하고 단련을 대신하고, 스스로 발견을 기대 말고 목록과 절차가 걸러주게 한다.", "h": "서로 다른 층"}, {"body": "결정의 세계는 규칙적인가 되먹임은 빠른가 먼저 묻는다. 결정 전에 미리 실패를 가정하고 까닭을 적어 둔다. 확신의 크기가 아니라 환경과 절차가 가른다. 절차가 확신보다 먼저 선다.", "h": "앉기 전 점검"}], "sources": ["Daniel Kahneman · Gary Klein (2009) Conditions for Intuitive Expertise — 심리학 학술지", "John Hammond · Ralph Keeney · Howard Raiffa (1998) The Hidden Traps in Decision Making — 경영전문지"]}, "title": "확신의 강도는 판단의 질과 무관하다"}</script>
<script>
window.TPL={"kpTitle": "이야기에서 건진 것", "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
</script>
