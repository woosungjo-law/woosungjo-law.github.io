<script id="col-data" type="application/json">{"byline": "조우성", "cards": {"cards": [{"body": "그랜트《히든 포텐셜》을 읽고 정리한 연구 노트. 잠재력이라는 말이 가리키는 곳을 묻는다. 이 글이 던지는 것은 '잘하는가'가 아니라 '바꾸고 있는가'다.", "kind": "cover", "small": "연구 노트 · 성장 · 2023", "title": "가능성은 출발점이 아니라 이동 거리다"}, {"body": "출발점은 쌓인 결과이고, 이동 거리는 오늘 바꿀 수 있는 한 가지다. 재능은 완성품처럼 보이지만, 가능성은 고침이 쌓여 길이 되는 일이다. 눈금은 점수가 아니라 걸음에 둔다.", "kind": "point", "small": "개념 정의", "title": "두 가지를 나누면"}, {"body": "우리 모두는 더 잘 개선하는 법을 익힐 수 있다. 개선하는 법 자체를 배운다는 말이 이 글의 뼈대다. 그 한 줄이 가리키는 곳은 바로 오늘 바꿀 한 가지다.", "kind": "quote", "small": "《히든 포텐셜》(2023) · 필자 번역", "title": "그랜트의 한 줄"}, {"body": "공백을 감점으로만 보지 않고 그 기간의 학습을 살핀다. 공백을 채운 방식에는 낯선 일을 배우고 실패를 고친 흔적이 있다. 출발선이 낮아도 방향은 바뀐다.", "kind": "point", "small": "적용", "title": "서류를 읽는 눈금"}, {"body": "버티는 시간과 바꾸는 시도는 다르다. 되먹임을 받아 고친 시도가 쌓일 때 실력은 몸의 기록이 된다. 같은 방향의 작은 고침이 겹치면 조용히 단단한 길이 난다.", "kind": "point", "small": "한 걸음 더", "title": "노력의 질"}, {"body": "이번 주 바꾼 한 가지와 그것이 다음 시도를 어떻게 다르게 만들었는지 적는다. 남의 출발선을 한계로 쓰지 않고 자신의 이동 기록을 다음 출발점으로 삼는다.", "kind": "close", "title": "점검 문장 하나"}], "source_line": "애덤 그랜트 (2023) 《히든 포텐셜》 Hidden Potential"}, "col_id": "LR-B-003", "col_type": "개념정의형", "date": "2026-09-30", "kicker": "연구 노트 · 성장", "summary": {"headline": "출발선이 아니라 걸어온 걸음을 본다", "keypoints": ["잠재력은 지금 잘하는 정도가 아니라 변화의 기록이다.", "출발선보다 고쳐 온 걸음이 다음 기회를 정한다.", "버티는 것과 바꾸는 것은 다르다. 되먹임이 실력을 만든다.", "이번 주 바꾼 한 가지와 그 효과를 문장으로 남긴다."], "lede": "그랜트의 《히든 포텐셜》에서 가장 오해받는 말은 '잠재력' 자체입니다. 지금의 높이가 아니라 고쳐 온 기록을 가리킵니다. 이 구분은 사람을 읽는 눈금을 출발선에서 이동 거리로 옮깁니다.", "pull_quote": "가능성의 크기는 출발선의 높이가 아니라 고쳐 온 걸음에 가깝다.", "sections": [{"body": "출발점은 지금까지 쌓인 결과이고, 이동 거리는 오늘 바꿀 수 있는 한 가지다. 그랜트는 가능성을 현재의 높이가 아니라 변화의 기록으로 본다. 이 구분이 서류를 읽는 눈금을 바꾼다.", "h": "출발점과 이동 거리"}, {"body": "버티는 시간과 바꾸는 시도는 다르다. 되먹임을 받아 다음 시도를 고칠 때 실력은 말의 목록이 아니라 몸의 기록이 된다. 고침이 쌓이면 가능성은 길이 된다.", "h": "노력의 방향까지 묻는다"}, {"body": "'가능성이 있는가' 대신 '무엇을 고치면 다음 시도가 달라지는가'를 묻는다. 전자는 사람을 가두지만, 후자는 내일의 시도를 설계하게 한다. 눈금은 점수가 아니라 걸음이 된다.", "h": "질문을 바꾸면"}, {"body": "이번 주에 바꾼 한 가지와 그것이 다음 시도를 어떻게 다르게 만들었는지 적어 둔다. 바뀐 것이 없다면 버틴 것은 많았어도 배운 것은 적었을지 모른다. 같은 방향의 작은 고침이 겹치면 조용히 단단한 길이 난다.", "h": "이번 주 점검"}], "sources": ["애덤 그랜트 (2023) 《히든 포텐셜》 Hidden Potential — 도서"]}, "title": "가능성은 출발점이 아니라 이동 거리다"}</script>
<script>
window.TPL={"kpTitle": "두 관점, 한눈에", "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
</script>
