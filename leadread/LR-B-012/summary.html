<script id="col-data" type="application/json">{"byline": "조우성", "cards": {"cards": [{"body": "보스《우리는 어떻게 마음을 움직이는가》를 읽고 정리한 연구 노트. 설득과 승패의 문제로만 보면 놓치는 것을 묻는다. 이 글이 던지는 것은 꺾음이 아니라 이해다.", "kind": "cover", "small": "연구 노트 · 소통 · 2016", "title": "꺾는 기술이 아니라 이해하는 과정이다"}, {"body": "상대를 꺾는 기술과 상대의 현실을 이해하는 과정이다. 우리는 쉽게 산만해진다. 듣고 싶은 것만 골라 듣는 버릇을 아는 것이 절반이고 다뤄야 나머지 절반이다.", "kind": "point", "small": "개념 정의", "title": "두 가지를 나누면"}, {"body": "협상은 입심 좋은 사람의 무대가 아니라 서로 다른 처지를 확인하고 다음 걸음을 약속하는 일이다. 늘 한가운데서 만나라는 기계적 규칙이 공정한지도 다시 묻는다.", "kind": "point", "small": "낯선 구분", "title": "무대가 아니라 확인이다"}, {"body": "나눠 갖지 않는다는 말은 윽박지르거나 밀어붙이라는 뜻이 아니라 판의 조건을 다시 보는 일이다. 상대가 얻고 잃는 것을 먼저 헤아려야 현실적인 합의가 된다.", "kind": "point", "small": "적용", "title": "조건을 다시 본다"}, {"body": "마음을 헤아리는 일과 고개를 끄덕이는 일은 다르다. 속을 비춘 뒤 사실과 조건, 금을 분명히 할 수 있다. 선이 있어야 서로 안심하고 다음으로 넘어간다.", "kind": "point", "small": "한 걸음 더", "title": "헤아림과 동의는 다르다"}, {"body": "다음 협의 전에 상대가 지키려는 것과 두려워하는 것을 적는다. 두 줄을 먼저 확인하면 내 요구는 뒤에 꺼내도 늦지 않다. 순서가 바뀌면 결과도 바뀐다. 순서가 성질을 정한다.", "kind": "close", "title": "점검 문장 하나"}], "source_line": "크리스 보스 · 탈 라즈 (2016) 《우리는 어떻게 마음을 움직이는가》 Never Split the Difference"}, "col_id": "LR-B-012", "col_type": "개념정의형", "date": "2026-09-30", "kicker": "연구 노트 · 소통", "summary": {"headline": "이기는 법이 아니라 이해하는 법을 묻는다", "keypoints": ["설득과 승패로만 보면 합의의 성패를 놓친다.", "듣고 싶은 것만 골라 듣는 버릇을 다뤄야 한다.", "나눠 갖기는 공정해 보여도 급소를 풀지 못한다.", "상대가 지키려는 것과 두려워하는 것을 먼저 적는다."], "lede": "보스와 라즈의 책에서 먼저 뒤집히는 생각은 협상에 관한 것입니다. 설득과 승패의 문제로만 보면 놓치는 것이 있습니다. 이 구분은 꺾음이 아니라 이해를 묻습니다.", "pull_quote": "전술보다 성질이 먼저다.", "sections": [{"body": "상대를 꺾는 기술과 상대의 현실을 이해하는 과정이다. 우리는 쉽게 산만해진다. 듣고 싶은 것만 골라 듣는 버릇이 있다는 뜻이다. 버릇을 다뤄야 바뀐다.", "h": "두 가지"}, {"body": "협상은 입심 좋은 사람의 무대가 아니라 서로 다른 처지를 확인하고 다음 걸음을 약속하는 일이다. 나눠 갖기는 공정해 보여도 양쪽의 급소를 풀지 못할 수 있다.", "h": "무대가 아니라 확인이다"}, {"body": "나눠 갖지 않는다는 말은 판의 조건을 다시 보는 일이다. 상대가 얻고 잃는 것을 먼저 헤아려야 현실적인 합의가 된다. 마음을 헤아리는 일과 고개를 끄덕이는 일은 다르다.", "h": "조건을 다시 본다"}, {"body": "어떻게 이길까가 아니라 상대는 무엇을 지키려 하는가를 묻는다. 다음 협의 전에 상대가 지키려는 것과 두려워하는 것을 적는다. 순서가 <script>
window.TPL={"kpTitle": "이야기에서 건진 것", "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');

    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');

  }

  /* keypoints */

    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
