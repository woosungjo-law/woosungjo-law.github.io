<script id="col-data" type="application/json">{"byline": "조우성", "cards": {"cards": [{"body": "콜린스《좋은 기업을 넘어 위대한 기업으로》를 읽고 정리한 연구 노트. 위대함을 이끈 얼굴이 화려하지 않음을 묻는다. 이 글이 묻는 것은 드러냄이 아니라 남김이다.", "kind": "cover", "small": "연구 노트 · 전략 · 2001", "title": "위대함은 떠난 뒤에 남는다"}, {"body": "개인적 겸손함과 직업적 의지다. 겸손하고 말수 적으며 조직과 소명을 앞세우는 태도와 옳은 일에 대한 단호한 결단력이다. 어느 하나만으로는 위대함에 닿지 않는다.", "kind": "point", "small": "개념 정의", "title": "두 가지를 나누면"}, {"body": "레벨 5 리더들은 개인적 겸손함과 직업적 의지의 역설적인 조합을 구현한다. 겸손 없는 의지는 독선이 되고 의지 없는 겸손은 방관이 된다. 조합이 핵심이다.", "kind": "quote", "small": "《좋은 기업을 넘어 위대한 기업으로》(2001) · 필자 번역", "title": "콜린스의 레벨 5"}, {"body": "화려한 수장은 단기 성과를 낼 수 있지만 떠난 뒤 조직이 흔들린다. 레벨 5는 자신이 없어도 도는 조직을 목표로 삼는다. 사람이 바뀌어도 도는 틀을 남긴다.", "kind": "point", "small": "적용", "title": "떠난 뒤의 조직"}, {"body": "이 방식은 여리거나 움츠린 것과 다르다. 옳은 일을 향한 굳은 결기를 갖되 그 불길이 자신을 비추는 데가 아니라 조직을 키우는 데 쓰인다. 야망의 주인이 바뀌면 결과가 바뀐다.", "kind": "point", "small": "한 걸음 더", "title": "불길의 방향"}, {"body": "이번 주 내 결정이 나를 위한 것인지 조직을 위한 것인지 적는다. 조직을 위한 것이 적다면 다음 주에는 하나라도 늘린다. 하나가 쌓이면 주인이 바뀐다. 쌓임이 바꾼다.", "kind": "close", "title": "점검 문장 하나"}], "source_line": "짐 콜린스 (2001) 《좋은 기업을 넘어 위대한 기업으로》 Good to Great"}, "col_id": "LR-B-010", "col_type": "개념정의형", "date": "2026-09-30", "kicker": "연구 노트 · 전략", "summary": {"headline": "드러냄이 아니라 남김을 본다", "keypoints": ["위대함을 이끈 얼굴은 화려한 스타가 아니었다.", "겸손 없는 의지는 독선이고 의지 없는 겸손은 방관이다.", "자신이 없어도 도는 틀을 남기는 것이 목표다.", "이번 주 결정이 누구를 위한 것인지 적는다."], "lede": "콜린스의 《좋은 기업을 넘어 위대한 기업으로》에서 놀라운 발견은 리더의 얼굴입니다. 위대함을 이끈 사람들은 화려한 스타가 아니었습니다. 이 구분은 야망의 주인을 묻습니다.", "pull_quote": "이어지는 것이 위대함이고, 끝나는 것이 평범이다.", "sections": [{"body": "개인적 겸손함과 직업적 의지다. 겸손하고 말수 적으며 조직과 소명을 앞세우는 태도와 옳은 일에 대한 단호한 결단력이다. 어느 하나만으로는 위대함에 닿지 않는다.", "h": "두 가지"}, {"body": "화려한 수장은 단기 성과를 낼 수 있지만 떠난 뒤 조직이 흔들린다. 레벨 5는 자신이 없어도 도는 조직을 목표로 삼는다. 사람이 바뀌어도 도는 틀을 남긴다.", "h": "떠난 뒤의 조직"}, {"body": "이 방식은 여리거나 움츠린 것과 다르다. 옳은 일을 향한 굳은 결기를 갖되 그 불길이 조직을 키우는 데 쓰인다. 야망의 주인이 바뀌면 같은 에너지가 다른 결과를 낸다.", "h": "불길의 방향"}, {"body": "어떻게 드러낼까가 아니라 무엇을 남길까를 묻는다. 이번 주 내 결정이 나를 위한 것인지 조직을 위한 것인지 적는다. 하나가 쌓이면 주인이 바뀐다. 쌓임이 바꾼다.", "h": "남기는 질문"}], "sources": ["짐 콜린스 (2001) 《좋은 기업을 넘어 위대한 기업으로》 Good to Great — 도서"]}, "title": "위대함은 떠난 뒤에 남는다"}</script>
<script>
window.TPL={"kpTitle": "남겨 둘 문장", "splitLede": true, "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
</script>
