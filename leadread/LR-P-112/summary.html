", "title": "순서가 반대다", "body": "한쪽은 공유된 경험을 쌓고 나서 말하라고 하고 다른 쪽은 말하게 만드는 구조를 먼저 놓으라고 한다. 두 처방은 배타적이지 않지만 적용 순서가 다르다.", "small": "필자의 이어 붙임"}, {"kind": "close", "title": "오늘의 점검", "body": "팀의 가장 조용한 사람이 나를 아직 평가하지 못하는 것인지 말한 뒤에 무슨 일이 일어날지 예측하지 못하는 것인지 구분한다. 두 대답이 다른 행동을 만든다."}], "source_line": "Simons \u0026 Peterson (2000) Journal of Applied Psychology · Edmondson (1999) Administrative Science Quarterly"}}</script>
<script>
window.TPL={"kpTitle": "핵심 정리", "ledeLabel": "핵심 정의", "srcTitle": "출처"};

  var D;

    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;

  var S = D.summary || {};
  function el(t, c, x) {

    if (c) e.className = c;

    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
