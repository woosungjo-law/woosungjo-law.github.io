<script id="col-data" type="application/json">{"col_id": "LR-P-156", "title": "피드백은 언제 학습이 되고 언제 판정이 되는가", "col_type": "대립형", "kicker": "논문 · 피드백", "byline": "조우성", "date": "2026-11-21", "summary": {"headline": "지적을 따르느라 판단을 멈출 때", "lede": "같은 피드백이 어떤 사람에게는 실험의 재료가 되고 어떤 사람에게는 평가자의 눈이 된다. 두 연구는 그 갈림길을 주의와 설계에서 찾는다.", "sections": [{"h": "프레임 — 주의가 어디로 가는가", "body": "피드백 개입은 평균적으로 성과를 올렸지만 상당수에서는 떨어뜨렸다. 주의가 과제에 머물면 학습이 되고, 자기 평가의 층으로 올라가면 방어와 회피가 생긴다."}, {"h": "반증 — 말 뒤의 설계", "body": "다면 피드백 이후의 개선은 대체로 작았다. 필요성을 느끼고, 받아들일 준비가 있고, 바꿀 수 있다고 믿고, 목표를 세워 옮길 때에야 가능성이 커진다."}, {"h": "적용 — 네 가지", "body": "먼저 상대가 본 장면을 말하게 한다. 성격이 아니라 관찰 가능한 선택을 다룬다. 고칠 항목을 줄이고 다음 확인 행동을 함께 정한다. 결과가 아니라 목적에 낸 차이를 묻는다."}, {"h": "인문 렌즈 — 대화와 권력", "body": "프레이리는 교육을 지식을 넣는 일이 아니라 세계를 함께 읽는 대화로 보았다. 정답을 쥔 사람과 고치는 사람의 구도에서는 평가 권력이 학습을 앞선다."}], "keypoints": ["피드백은 내용이 아니라 주의의 방향으로 작동한다", "평균 효과는 개별 효과를 보장하지 않는다", "개선은 수용·가능성·목표·행동이 붙을 때 생긴다", "구체성만으로는 학습이 되지 않는다", "면담에만 가두면 시스템의 책임이 사라진다"], "pull_quote": "피드백이 학습을 멈추게 하는 순간은 틀린 말을 해서만이 아니라 한 사람의 판정이 대화를 닫을 때 온다.", "sources": ["Kluger \u0026 DeNisi (1996) → Smither·London·Reilly (2005) — TOPIC-27"]}, "cards": {"cards": [{"kind": "cover", "title": "노트에 적었지만", "body": "세 가지를 짚어 주었더니 결론은 앞으로 올라왔다. 그런데 질문을 받으면 준비한 문장만 읽었다. 지적을 따르느라 판단을 멈춘 것이다.", "small": "TOPIC-27"}, {"kind": "point", "title": "주의의 위치", "body": "주의가 과제 수행에 머물면 피드백은 재료가 된다. '나는 유능한가'라는 층으로 올라가면 방어와 회피와 긴장이 생기고 수행은 약해진다.", "small": "프레임"}, {"kind": "compare", "title": "평균과 개별", "body": "개입은 평균적으로 성과를 올렸다. 그러나 상당 부분에서는 떨어뜨렸다. 평균 효과는 내 옆 사람에게 일어날 일을 보장하지 않는다.", "small": "프레임"}, {"kind": "point", "title": "말 뒤의 설계", "body": "다면 피드백 이후의 개선은 대체로 작았다. 필요성, 수용, 바꿀 수 있다는 믿음, 목표, 반복 행동이 붙지 않으면 정교한 문장도 남지 않는다.", "small": "반증"}, {"kind": "point", "title": "구체성의 한계", "body": "'3분 44초가 좋았다'도 원리를 모르면 칭찬으로 끝난다. 반대로 '결론을 앞에 둬라'도 목적과 선택지를 함께 논의하면 가설이 된다.", "small": "적용"}, {"kind": "close", "title": "한 문장 점검", "body": "마지막 피드백은 상대의 시선을 일로 보냈는가, 아니면 나에게 묶어 두었는가. 수정 지시 하나를 질문 하나로 바꿔 보라.", "small": "바로 쓸 점검"}], "source_line": "Kluger \u0026 DeNisi (1996) · Smither 등 (2005) 재구성"}}</script>
<script>
window.TPL={"kpTitle": "남겨 둘 문장", "splitLede": true, "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
</script>
