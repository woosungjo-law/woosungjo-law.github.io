<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

<script id="col-data" type="application/json">{"col_id": "LR-P-099", "title": "편애는 감정이 아니라 편차의 문제다", "col_type": "대립형", "kicker": "연구 노트", "byline": "조우성", "date": "2026-10-05", "summary": {"headline": "편애는 어디까지가 역할 설계인가", "lede": "깊은 관계가 성과를 만든다는 관점과, 그 깊이의 편차가 비용이 된다는 관점은 층이 다르다.", "sections": [{"h": "곁에 두는 사람이 성과를 만든다", "body": "시간과 관심이 한정되어 있으므로 리더는 소수와 깊은 관계를 맺고 더 큰 재량을 맡깁니다. 리더십은 관계의 총합입니다."}, {"h": "차등은 보이는 순간 비용이 된다", "body": "상사와의 관계가 좋은 사람도 동료가 더 가까운 것을 알면 만족과 몰입이 떨어집니다. 관리할 것은 깊이가 아니라 편차입니다."}, {"h": "통제할 잣대를 편들지 않기", "body": "규칙과 기회와 보상은 통제할 수 있고 누구에게 마음이 가는지는 통제되지 않습니다. 차등의 이유를 문서로 남기고 결정 절차에 다른 목소리를 넣습니다."}], "keypoints": ["관계의 질은 말로 정해지지 않고 일을 함께 겪으며 자라며, 질이 높은 쪽이 더 많은 자율과 책임을 집니다.", "결과를 바꾼 것은 관계의 질만이 아니라 편차였고, 잘 받은 사람도 특권으로 읽고 불안해합니다.", "규칙과 기회는 통제할 수 있는 영역이고 마음이 가는 방향은 통제되지 않으므로, 통제할 잣대를 편들지 않게 세워야 합니다."], "pull_quote": "깊은 관계가 성과를 만든다는 것과, 그 깊이가 눈에 보이는 순간 비용이 된다는 것은 함께 설 수 있습니다.", "sources": ["Graen \u0026 Uhl-Bien (1995) → Hooper \u0026 Martin (2008)"]}, "cards": {"cards": [{"kind": "cover", "title": "편애인가 역할 설계인가", "body": "리더가 누군가를 곁에 두는 일을 사사로운 감정으로만 보면 핵심을 놓칩니다. 어디까지가 역할 설계인지가 쟁점입니다.", "small": "Graen \u0026 Uhl-Bien (1995) → Hooper \u0026 Martin (2008)"}, {"kind": "point", "title": "차등을 엔진으로 본다", "body": "시간과 관심은 한정되어 있습니다. 좋은 리더는 소수와 깊은 관계를 맺고 먼저 정보를 주고 더 큰 재량을 맡깁니다.", "small": "프레임"}, {"kind": "compare", "title": "편차가 사람을 흔든다", "body": "상사와의 관계가 좋아도 동료가 더 가까운 것을 알면 만족이 떨어집니다. 잘 받은 사람도 오늘의 총애를 내일의 처분으로 읽습니다.", "small": "반증"}, {"kind": "point", "title": "통제할 잣대", "body": "규칙과 기회와 보상은 통제할 수 있고 마음이 가는 방향은 통제되지 않습니다. 차등의 이유를 문서로 남겨야 편애가 역할이 됩니다.", "small": "겸애의 영역"}, {"kind": "close", "title": "성과로 뽑혔는가", "body": "우리 조직에서 가까운 사람은 성과로 뽑힌 사람인가, 습관으로 가까워진 사람인가. 앞이라면 결속이고 뒤라면 편애입니다.", "small": "한 문장 점검"}], "source_line": "Graen \u0026 Uhl-Bien (1995) → Hooper \u0026 Martin (2008)"}}</script>
<script>
window.TPL={"kpTitle": "이야기에서 건진 것", "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
</script>
