<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="color-scheme" content="light dark">

<meta property="og:description" content="비공개는 성과와 보상의 연결을 흐리고, 공개는 상대적 위치를 선명하게 한다.">

<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.85;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p,ol,ul,blockquote{margin:0;padding:0}
ol,ul{list-style:none}
.page{display:flex;flex-direction:column;margin:0 auto;width:100%}
.hd{order:1}.pq{order:2}.secs{order:3}.kp{order:4}.ft{order:5}
.kicker{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--acc)}
.headline{font-family:var(--head);word-break:keep-all;text-wrap:balance}
.meta{font-family:var(--sans);font-size:13px;color:var(--mute);letter-spacing:.02em}
.meta .dot{margin:0 .55em;opacity:.6}
.sec-body p+p{margin-top:.9em}
.ft{font-family:var(--sans);font-size:13px;line-height:1.7;color:var(--mute)}
.ft h3{font-size:12px;letter-spacing:.14em;font-weight:600;margin-bottom:6px;color:var(--ink)}
.ft .src li{padding-left:1em;text-indent:-1em}
.ft .src li::before{content:"· "}
.ft .disc{margin-top:18px}
.ft .by{margin-top:4px;color:var(--ink);font-weight:600}
a{color:inherit}
@media (prefers-reduced-motion:no-preference){.page>*{animation:rise .5s ease both}.page>*:nth-child(2){animation-delay:.05s}.page>*:nth-child(3){animation-delay:.1s}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* S3 사례형 — 딥그린 & 클레이 / 세로 타임라인 */
:root{--bg:#f1f3ea;--ink:#1c2a22;--mute:#5d6b60;--acc:#1f4d3a;--clay:#a4552b;--line:#1f4d3a;--soft:#e4e9da;--head:"Nanum Myeongjo","Noto Serif KR",serif;--body:"Nanum Myeongjo","Noto Serif KR",serif;--sans:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1913;--ink:#dfe8de;--mute:#93a598;--acc:#86c4a2;--clay:#d98d63;--line:#86c4a2;--soft:#15251c}}
body{font-size:17.5px;line-height:1.9}
.page{max-width:760px;padding:36px 20px 80px}
.kicker{color:var(--clay);display:block;margin-bottom:14px}
.headline{font-weight:800;font-size:clamp(27px,6vw,44px);line-height:1.34;letter-spacing:-.02em;color:var(--acc)}
.hd::before{content:"";display:block;width:44px;height:4px;background:var(--clay);margin-bottom:24px}
.lede{margin-top:22px;font-size:clamp(17px,2.4vw,19.5px);line-height:1.9;color:var(--ink);opacity:.9}
.meta{margin-top:18px}
.pq{margin:34px 0 0;padding:22px 24px;background:var(--soft);border-radius:2px}
.pq p{font-weight:800;font-size:clamp(18px,3vw,23px);line-height:1.6;color:var(--acc)}
.secs{margin:44px 0 0;position:relative}
.secs::before{content:"";position:absolute;left:19px;top:14px;bottom:20px;width:2px;background:repeating-linear-gradient(to bottom,var(--line) 0 8px,transparent 8px 14px);opacity:.55}
.sec{position:relative;padding:0 0 42px 62px}
.sec:last-child{padding-bottom:6px}
.sec .num{position:absolute;left:0;top:-2px;width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:700;font-size:14px;box-shadow:0 0 0 6px var(--bg)}
.sec h2{font-weight:800;font-size:clamp(20px,3.4vw,24px);line-height:1.45;margin-bottom:10px;padding-top:4px;color:var(--ink)}
.sec-body{font-size:17px}
.kp{margin:40px 0 0;padding:26px 22px;border:2px solid var(--acc);border-radius:2px}
.kp-t{font-family:var(--sans);font-size:13px;letter-spacing:.14em;font-weight:700;color:var(--clay);margin-bottom:12px}
.kp li{display:flex;gap:14px;padding:9px 0}
.kp-n{flex:none;font-family:var(--sans);font-weight:700;font-size:13px;color:var(--clay);padding-top:.4em}
.kp-x{font-weight:700;line-height:1.7}
.ft{margin-top:44px;padding-top:18px;border-top:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
@media (min-width:820px){
  .page{padding:72px 32px 110px}
  .secs::before{left:23px}
  .sec{padding-left:84px}
  .sec .num{width:48px;height:48px;font-size:16px}
  .sec h2{padding-top:9px}
}
</style>
</head>
<body data-tpl="S3">
<main id="root" class="page"></main>
<noscript><p style="padding:24px">이 페이지는 JavaScript가 필요합니다.</p></noscript>
<script id="col-data" type="application/json">{"col_id": "LR-P-119", "title": "보상 공개는 신호를 열고 서열을 드러낸다", "col_type": "대립형", "kicker": "보상 정보의 양면성", "byline": "조우성", "date": "2026-10-07", "summary": {"headline": "보상 정보는 규칙과 서열을 함께 드러낸다", "lede": "비공개는 성과와 보상의 연결을 흐리고, 공개는 상대적 위치를 선명하게 한다.", "sections": [{"h": "비밀이 지우는 신호", "body": "Belogolovsky와 Bamberger는 보상 비밀이 성과와 보상의 연결을 약하게 읽히게 할 수 있다고 설명한다."}, {"h": "공개가 드러내는 서열", "body": "Card와 공동 연구자들은 동료 보수가 공개될 때 중간값 아래의 구성원이 보상과 이직 가능성을 다르게 평가할 수 있음을 보였다."}, {"h": "금액보다 먼저 규칙", "body": "공개 여부보다 먼저 평가 기준, 예외, 이의 제기와 이동 경로를 설계해야 정보가 신뢰의 재료가 된다."}], "keypoints": ["비밀은 성과와 보상의 연결을 흐릴 수 있다", "공개는 상대적 서열을 선명하게 만든다", "금액보다 평가 규칙과 이동 경로가 먼저다"], "pull_quote": "공개의 핵심은 숫자의 노출이 아니라 납득 가능한 기준의 공개다.", "sources": ["Elena Belogolovsky \u0026 Peter A. Bamberger (2014) Signaling in Secret", "David Card, Alexandre Mas, Enrico Moretti \u0026 Emmanuel Saez (2012) Inequality at Work"]}, "cards": {"cards": [{"kind": "point", "title": "비밀의 비용", "body": "보상 비밀은 갈등을 줄이는 듯 보이지만, 성과가 보상으로 이어지는지 판단할 신호를 흐릴 수 있다. 성과급의 규칙이 보이지 않으면 공백은 추측으로 채워진다."}, {"kind": "compare", "title": "공개의 반대 비용", "body": "동료 보수의 공개는 추측을 줄이는 대신 자신의 상대적 위치와 서열을 더 선명하게 보여 준다. 특히 비교 기준 아래에 있는 사람에게 정보의 비용이 커질 수 있다."}, {"kind": "point", "title": "규칙 먼저", "body": "금액표를 열기 전에 직무와 등급별 기준, 예외, 검토 절차를 문서로 공개해야 한다. 기준이 있어야 숫자가 설명이 되고 공개가 신뢰로 이어진다."}, {"kind": "point", "title": "이동 경로", "body": "기준 아래에 있는 사람에게 정보만 주지 말고 다음 단계로 이동할 조건과 경로를 함께 제시한다. 비교를 열었다면 회복할 출구도 함께 설계해야 한다."}, {"kind": "close", "title": "마지막 질문", "body": "우리 조직의 보상 비밀은 갈등을 보호하는가, 기준 없는 추측을 보호하는가? 공개할 금액보다 먼저 공개할 규칙은 무엇인가? 공개 정책은 한 번의 발표로 끝나지 않는다."}], "source_line": "Belogolovsky \u0026 Bamberger (2014) · Card et al. (2012)"}}</script>
<script>
window.TPL={"kpTitle": "이야기에서 건진 것", "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
</script>
</body>
</html>
