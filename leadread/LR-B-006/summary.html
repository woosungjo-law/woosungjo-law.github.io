<script id="col-data" type="application/json">{"byline": "조우성", "cards": {"cards": [{"body": "올리버 버크먼《4000주》를 읽고 정리한 연구 노트. 효율이 왜 우리를 더 바쁘게 만드는지 묻는다. 이 글이 겨누는 것은 목록이 아니라 약속의 성질이다.", "kind": "cover", "small": "연구 노트 · 성장 · 2021", "title": "다 끝내고 시작하겠다는 약속"}, {"body": "생산성은 함정이다. 효율이 오르면 목록이 줄어드는 대신 속도가 올라간다. 방향을 묻지 않은 노력이 스스로를 갉아먹는다. 함정은 노력이 아니라 방향에 있다.", "kind": "quote", "small": "《4000주》(2021) · 필자 번역", "title": "버크먼의 한 줄"}, {"body": "여유가 생기면 시작하겠다는 약속에 익숙하다. 받은 편지를 지우고 밀린 답을 마친 뒤에야 중요한 일을 하겠다는 다짐이다. 시간은 빈칸을 기다려 주지 않는다.", "kind": "point", "small": "낯선 관찰", "title": "여유 약속"}, {"body": "닫히지 않는 목록은 다스릴 일이 아니라 읽을 신호다. 신호를 읽는 눈이 생기면 고르는 일이 먼저 오고 다스리는 일은 뒤에 선다. 경계를 읽으면 선택이 시작된다.", "kind": "point", "small": "읽는 눈", "title": "목록의 성질"}, {"body": "어떻게 다 끝낼까가 아니라 무엇을 끝내지 않은 채 살아갈까를 묻는다. 시작선 뒤에 둔 삶은 오지 않고 한가운데에 둔 일은 손에 잡힌다. 묻는 순간 하루가 열린다.", "kind": "point", "small": "전환", "title": "질문의 전환"}, {"body": "이번 주 목록에서 일부러 끝내지 않기로 한 일을 하나 고른다. 고른 일의 자리에 무엇을 대신 두었는지 함께 적는다. 첫 칸이 정해지면 다음 칸도 정해진다.", "kind": "close", "title": "점검 문장 하나"}], "source_line": "올리버 버크먼 (2021) 《4000주》 Four Thousand Weeks"}, "col_id": "LR-B-006", "col_type": "인용사색형", "date": "2026-09-30", "kicker": "연구 노트 · 성장", "summary": {"headline": "여유가 생기면 시작하겠다는 약속을 거둔다", "keypoints": ["효율이 오르면 목록이 아니라 속도가 올라간다.", "시간은 빈칸을 기다려 주지 않는다.", "닫히지 않는 목록은 다스릴 일이 아니라 읽을 신호다.", "일부러 끝내지 않을 일을 정하고 첫 칸을 배정한다."], "lede": "버크먼의 《4000주》에서 먼저 멈추게 하는 대목은 효율에 관한 한 줄입니다. 생산성은 함정이라는 말입니다. 이 관찰은 여유가 생기면 시작하겠다는 약속의 성질을 묻습니다.", "pull_quote": "소중한 일은 한가해지면 하는 것이 아니라 제쳐 두면서 틈을 내는 일이다.", "sections": [{"body": "생산성은 함정이다. 효율이 오르면 목록이 줄어드는 대신 속도가 올라간다. 비운 자리는 다시 새 할 일로 메워진다. 방향을 묻지 않은 노력이 스스로를 갉아먹는다.", "h": "한 줄의 관찰"}, {"body": "여유가 생기면 시작하겠다는 약속에 익숙하다. 받은 편지를 지우고 밀린 답을 마친 뒤에야 중요한 일을 하겠다는 다짐이다. 다짐은 반복되지만 목록은 줄지 않는다.", "h": "여유 약속"}, {"body": "닫히지 않는 목록은 다스릴 일이 아니라 읽을 신호다. 소중한 일은 한가해지면 하는 것이 아니라 다른 좋은 일을 제쳐 두면서 틈을 내는 일이다. 끝이 있음을 받아들이면 하루가 열린다.", "h": "목록의 성질"}, {"body": "어떻게 다 끝낼까가 아니라 무엇을 끝내지 않은 채 살아갈까를 묻는다. 이번 주 목록에서 일부러 끝내지 않을 일을 하나 고른다. 오늘의 첫 한 칸을 먼저 배정한다.", "h": "남기는 질문"}], "sources": ["올리버 버크먼 (2021) 《4000주》 Four Thousand Weeks — 도서"]}, "title": "다 끝내고 시작하겠다는 약속"}</script>
<script>
window.TPL={"kpTitle": "남겨 둘 문장", "splitLede": true, "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
