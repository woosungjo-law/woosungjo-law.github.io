<script id="col-data" type="application/json">{"col_id": "LR-P-207", "title": "찾는 힘과 지키는 힘은 다른 근육이다", "col_type": "대립형", "kicker": "안전 · 지속", "byline": "조우성", "date": "2026-11-26", "summary": {"headline": "보고가 늘어도 같은 사건이 다시 온다면", "lede": "찾는 체계는 시야를 넓히고 지키는 체계는 바꾼 것을 유지한다. 찾는 데 성공하고 지키는 데 실패하면 조직은 같은 사건을 매년 처음 본다.", "sections": [{"h": "수동 보고의 천장", "body": "능동 감시와 수동 보고를 견준 연구들은 수동 보고가 사건을 상당히 적게 잡는다고 본다. 성능은 건수가 아니라 포착률로 봐야 한다."}, {"h": "지속의 세 축", "body": "실증 연구 17편에서 62개 요인이 사람·과정·조직 환경으로 묶였다. 중요한 것은 조율된 전달, 현장 맞춤 통합, 이어지는 노력이었다."}, {"h": "근거와 조건", "body": "효과가 큰 실천도 실행 조건이 없으면 현장에 남지 않는다. 근거 목록과 조건 목록을 함께 읽어야 무엇을 어떻게 할지가 같이 나온다."}, {"h": "탐구와 수정", "body": "탐구는 의심에서 시작해 검증에서 끝나고, 검증은 행동의 수정으로 확인된다. 수정되지 않은 탐구는 절반의 탐구다."}], "keypoints": ["포착률과 유지율을 나란히 센다", "조용한 구역은 없는 구역이 아니다", "개선마다 담당과 확인 시점을 둔다", "근거 없는 조건은 낭비다", "수정 안 된 탐구는 다시 안건으로"], "pull_quote": "탐구만 하고 수정을 놓치면 아는 것이 아니라 아는 척이 된다.", "sources": ["Estrada-Orozco 등 (2021) Journal of Patient Safety 17(8) e1866–e1872", "Moon, Hogden \u0026 Eljiz (2022) BMJ Open Quality 11(4) e002057", "Hall 등 (2020) Making Healthcare Safer III (AHRQ)"]}, "cards": {"cards": [{"kind": "cover", "title": "두 개의 근육", "body": "조직은 사건을 찾는 일과 개선을 지키는 일을 같은 일로 여긴다. 그러나 시야를 넓히는 근육과 바꾼 것을 유지하는 근육은 다르게 쓰인다.", "small": "출발점"}, {"kind": "point", "title": "수동 보고의 천장", "body": "열다섯 편을 모은 검토에서 네 편이 능동 감시와 수동 보고를 직접 견주었다. 수동 보고는 사건을 상당히 적게 잡았다. 두 방식을 함께 쓰라는 권고가 여기서 나왔다.", "small": "Estrada-Orozco 등 (2021)"}, {"kind": "compare", "title": "찾기와 지키기", "body": "찾기: 감시를 넓혀 포착률을 올린다||지키기: 사람·과정·환경이 함께 가야 바뀐 것이 남는다. 한쪽만 있으면 매년 같은 사건을 처음 본다", "small": "Moon 등 (2022)"}, {"kind": "point", "title": "지속의 세 축", "body": "실증 연구 열일곱 편, 평균 4.3년 뒤 평가에서 62개 요인이 사람·과정·환경으로 묶였다. 조율된 전달, 현장 맞춤 통합, 이어지는 노력이 중요했다.", "small": "Moon 등 (2022)"}, {"kind": "point", "title": "근거 옆에 조건", "body": "효과가 큰 실천도 교육과 자료 같은 조건이 없으면 현장에 남지 않는다. 근거 목록과 조건 목록을 나란히 두고 담당과 확인 시점을 적는다.", "small": "Hall 등 (2020)"}, {"kind": "close", "title": "두 지표", "body": "포착률과 유지율을 함께 세고 격차를 기록하라. 격차가 큰 쪽에 다음 분기의 노력을 두라. 두 지표가 함께 오를 때 개선은 체질이 된다.", "small": "점검"}], "source_line": "Estrada-Orozco 등 (2021) · Moon 등 (2022) · Hall 등 (2020) 토픽 재구성"}}</script>
<script>
window.TPL={"kpTitle": "남겨 둘 문장", "splitLede": true, "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
</script>
