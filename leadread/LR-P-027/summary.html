<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>응집력은 언제 판단을 막는가</title>
<meta name="description" content="재니스는 결속이 현실 검증을 누른다고 보고, 배런은 결속이 아니라 오염된 공유 그림이 문제라고 본다. 처방도 절차와 그림 교정으로 갈린다.">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="article">
<meta property="og:title" content="응집력은 언제 판단을 막는가">
<meta property="og:description" content="재니스는 결속이 현실 검증을 누른다고 보고, 배런은 결속이 아니라 오염된 공유 그림이 문제라고 본다. 처방도 절차와 그림 교정으로 갈린다.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;800;900&display=swap">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.85;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p,ol,ul,blockquote{margin:0;padding:0}
ol,ul{list-style:none}
.page{display:flex;flex-direction:column;margin:0 auto;width:100%}
.hd{order:1}.pq{order:2}.secs{order:3}.kp{order:4}.ft{order:5}
.kicker{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--acc)}
.headline{font-family:var(--head);word-break:keep-all;text-wrap:balance}
.meta{font-family:var(--sans);font-size:13px;color:var(--mute);letter-spacing:.02em}
.meta .dot{margin:0 .55em;opacity:.6}
.sec-body p+p{margin-top:.9em}
.ft{font-family:var(--sans);font-size:13px;line-height:1.7;color:var(--mute)}
.ft h3{font-size:12px;letter-spacing:.14em;font-weight:600;margin-bottom:6px;color:var(--ink)}
.ft .src li{padding-left:1em;text-indent:-1em}
.ft .src li::before{content:"· "}
.ft .disc{margin-top:18px}
.ft .by{margin-top:4px;color:var(--ink);font-weight:600}
a{color:inherit}
@media (prefers-reduced-motion:no-preference){.page>*{animation:rise .5s ease both}.page>*:nth-child(2){animation-delay:.05s}.page>*:nth-child(3){animation-delay:.1s}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* S1 대립형 — 잉크 & 크림 / 주홍 포인트 / 좌우 대칭 */
:root{--bg:#f6f1e7;--ink:#1b1a17;--mute:#6b655a;--acc:#b23a26;--line:#1b1a17;--soft:#ece4d3;--head:"Noto Serif KR","Nanum Myeongjo",serif;--body:"Noto Serif KR","Nanum Myeongjo",serif;--sans:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151412;--ink:#eee7d7;--mute:#a59d8c;--acc:#e0664f;--line:#eee7d7;--soft:#211f1b}}
body{font-size:16.5px}
.page{max-width:1040px;padding:28px 20px 72px}
.hd{border-top:4px solid var(--line);padding-top:6px;position:relative;text-align:center;margin-bottom:36px}
.hd::before{content:"";display:block;border-top:1px solid var(--line);margin-bottom:26px}
.kicker{display:inline-block;margin-bottom:14px}
.headline{font-weight:900;font-size:clamp(27px,6.2vw,52px);line-height:1.3;letter-spacing:-.02em}
.lede{max-width:680px;margin:22px auto 0;font-size:clamp(16px,2.3vw,19px);line-height:1.85;color:var(--ink);opacity:.88;text-align:left}
.meta{margin-top:20px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.pq{margin:6px auto 44px;max-width:760px;text-align:center;padding:30px 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:relative}
.pq p{font-weight:700;font-size:clamp(20px,3.6vw,30px);line-height:1.55;letter-spacing:-.01em;color:var(--acc)}
.pq::before{content:"\201C";position:absolute;left:50%;top:-20px;transform:translateX(-50%);background:var(--bg);padding:0 12px;font-size:44px;line-height:1;color:var(--acc);font-family:var(--head)}
.secs{display:grid;grid-template-columns:1fr;gap:0}
.sec{padding:0;position:relative}
.sec .num{display:block;font-family:var(--sans);font-weight:800;font-size:12px;letter-spacing:.14em;color:var(--acc);margin-bottom:8px}
.sec h2{font-size:clamp(20px,3.4vw,25px);font-weight:800;line-height:1.4;margin-bottom:12px;letter-spacing:-.01em}
.sec-body{font-size:16.5px;line-height:1.9}
.sec:nth-child(1),.sec:nth-child(2){padding-bottom:8px}
.sec:nth-child(2){margin-top:44px;padding-top:34px;border-top:1px solid var(--line)}
.sec:nth-child(2)::before{content:"VS";position:absolute;left:50%;top:-17px;transform:translateX(-50%);width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--acc);color:#fff;font:800 11px/34px var(--sans);text-align:center;letter-spacing:.04em}
.sec:nth-child(n+3){margin-top:36px;padding-top:28px;border-top:3px double var(--line)}
.kp{margin:44px 0 0;padding:26px 22px;background:var(--soft);border-top:3px solid var(--acc)}
.kp-t{font-family:var(--sans);font-size:13px;letter-spacing:.14em;font-weight:700;color:var(--acc);margin-bottom:14px}
.kp li{display:flex;gap:14px;padding:11px 0;border-top:1px solid color-mix(in srgb,var(--ink) 18%,transparent)}
.kp li:first-child{border-top:0}
.kp-n{flex:none;font-family:var(--sans);font-weight:800;font-size:13px;color:var(--acc);padding-top:.35em}
.kp-x{font-weight:600;line-height:1.7}
.ft{margin-top:44px;padding-top:20px;border-top:4px solid var(--line)}
@media (min-width:820px){
  .page{padding:48px 40px 96px}
  .secs{grid-template-columns:1fr 1fr;column-gap:0}
  .sec:nth-child(1){padding-right:40px}
  .sec:nth-child(2){margin-top:0;padding-top:0;border-top:0;padding-left:40px;border-left:1px solid var(--line)}
  .sec:nth-child(2)::before{left:-17px;top:0;transform:none}
  .sec:nth-child(n+3){grid-column:1/-1}
  .sec:nth-child(n+3) .sec-body{max-width:820px}
  .kp li{padding:13px 0}
}
</style>
</head>

<main id="root" class="page"></main>

<script id="col-data" type="application/json">{"col_id": "LR-P-027", "title": "응집력은 언제 판단을 막는가", "col_type": "대립형", "kicker": "논문 대립 노트", "byline": "조우성", "date": "2026-10-03", "summary": {"headline": "응집력은 언제 판단을 침범하는가", "lede": "재니스는 결속이 현실 검증을 누른다고 보고, 배런은 결속이 아니라 오염된 공유 그림이 문제라고 본다. 처방도 절차와 그림 교정으로 갈린다.", "sections": [{"h": "재니스: 결속이 검증을 누른다", "body": "응집력이 높은 집단에서 의견 일치에 대한 열망이 현실 검증의 동기를 누릅니다. 무오류성 확신, 자기 검열, 만장일치 착각이 겹치고, 결속을 해치는 정보가 걸러집니다."}, {"h": "배런: 문제는 오염된 공유 그림", "body": "응집력이 높은 집단이 집단사고를 낸다는 가설은 실험에서 일관된 지지를 받지 못했습니다. 결함의 출발점은 결속이 아니라, 집단이 공유한 그림의 내용입니다."}, {"h": "갈리는 지점과 처방", "body": "앞의 연구는 절차의 방어벽을, 뒤의 연구는 오염된 그림의 검증을 처방합니다. 방어벽을 세우는 일과 그 방어벽이 무엇을 검증하게 할지를 정하는 일은 함께 있어야 합니다."}], "keypoints": ["응집력은 언제 판단을 침범하는지가 문제다.", "결속을 해치는 정보가 처리 과정에서 걸러진다.", "집단사고 가설은 응집력만으로 설명되지 않는다.", "결함의 출발점은 오염된 공유 그림일 수 있다.", "절차의 방어벽과 그림의 검증은 함께 있어야 한다."], "pull_quote": "응집력은 자산이자 조건이다. 절차는 실패가 아니라 성공기에 세워야 한다.", "sources": ["I. L. Janis (1972) Victims of Groupthink — Houghton Mifflin (단행본)", "R. S. Baron (2005) So Right It's Wrong — Advances in Experimental Social Psychology 37, 219–253"]}, "cards": {"cards": [{"kind": "cover", "title": "응집력은 언제 판단을 막는가", "body": "응집력은 좋고 나쁨의 문제가 아니라, 언제 판단을 침범하는지의 문제다. 결속을 해치는 정보가 걸러지는 순간, 팀은 합의의 유지에 판단을 지불한다.", "small": "I. L. Janis (1972) vs R. S. Baron (2005)"}, {"kind": "compare", "title": "두 연구가 보는 원인", "body": "Janis: 응집력이 높은 집단에서 일치에 대한 열망이 현실 검증을 누른다.\nBaron: 결함의 출발점은 결속이 아니라, 오염된 공유 그림의 내용이다.", "small": "결속인가, 공유 그림인가"}, {"kind": "point", "title": "결속이 검증을 누르는 증상", "body": "무오류성에 대한 확신, 반대 의견의 무시, 자기 검열, 만장일치라는 착각이 겹칩니다. 실패는 정보 부족이 아니라 정보가 걸러진 데서 옵니다.", "small": "정보가 없어서가 아니다"}, {"kind": "point", "title": "처방은 두 축이다", "body": "절차의 방어벽을 세우는 일과, 그 방어벽이 검증할 공유 그림의 내용을 정하는 일이 함께 있어야 합니다. 방어벽만으로는 무엇을 볼지 정해지지 않습니다.", "small": "절차와 그림의 교정"}, {"kind": "close", "title": "절차는 성공기에 세운다", "body": "리더가 자기 입장을 마지막에 말하는 규칙, 새 팀원의 첫 이의가 기록에 남는 통로를 지금 만드십시오. 맹목은 실패가 아니라 성공의 반복 속에서 자랍니다.", "small": "칭자: 위기가 오게 만든 구조를 먼저 고친다"}], "source_line": "I. L. Janis (1972) Victims of Groupthink — Houghton Mifflin / R. S. Baron (2005) So Right It's Wrong — Advances in Experimental Social Psychology 37, 219–253"}}</script>
<script>
window.TPL={"kpTitle": "두 관점, 한눈에", "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
</script>
