의 제조기로 바뀐다고 한다.", "small": "두 논문이 갈리는 곳"}, {"kind": "close", "title": "점검 세 가지", "body": "최근 회의의 농담 과녁을 적어 보았는가. 리더가 먼저 웃음거리가 된 적이 있는가. 어떤 농담에 웃음이 반 박자 늦었는가.", "small": "바로 쓸 점검"}], "source_line": "Duncan·Smeltzer·Leap (1990) · Ford·Ferguson (2004) 재구성"}}</script>
