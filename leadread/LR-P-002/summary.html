<style>
*,*::before,*::after{box-sizing:border-box}

  .sec .sec-in{display:contents}
  .sec h2{grid-column:1;grid-row:1;margin:26px 0 0}
  .sec-body{grid-column:2;grid-row:1/span 2;font-size:17px}

<script id="col-data" type="application/json">{"byline": "조우성", "cards": {"cards": [{"body": "협상 논쟁을 읽고 정리한 연구 노트. 이익을 찾는 일과 첫 숫자를 다루는 일을 나란히 놓는다. 이 글이 던지는 것은 '말재주'가 아니라 '판의 설계'다.", "kind": "cover", "small": "연구 노트 · 소통", "title": "협상은 말재주가 아니라 판의 설계다"}, {"body": "입장을 주고받는 흥정은 현명하지도 효율적이지도 않다. 사람과 문제를 떼고 이익에 집중하며 이로운 선택지를 만들고 객관적 기준을 고집한다. 입장은 부딪혀도 이익은 겹친다.", "kind": "point", "small": "원칙적 협상", "title": "이익을 탐색하라"}, {"body": "첫 숫자를 던진 쪽이 유리했고 그 숫자는 최종 합의를 강하게 예측했다. 상대의 대안과 유보 가격처럼 어긋나는 정보에 주의를 돌리면 닻의 힘은 사라졌다.", "kind": "point", "small": "실험 연구", "title": "첫 숫자가 판을 정한다"}, {"body": "앞의 글에서 협상은 테이블 위의 탐색이고, 뒤의 연구에서 협상은 첫 숫자가 던져지는 순간의 설계다. 이익의 발견은 무엇을 나눌지를, 닻의 발견은 누가 정하는지를 말한다.", "kind": "compare", "small": "서로 다른 층", "title": "갈리는 곳"}, {"body": "자신이 강자인지 약자인지 모르는 상태에서도 받아들일 조건이 공정한 조건이다. 객관적 기준은 힘의 언어가 아니라 납득의 언어다. 앉기 전의 설계가 베일을 다시 세운다.", "kind": "point", "small": "필자의 이어 붙임", "title": "베일을 다시 세운다"}, {"body": "협상 없이 얻을 최선의 대안을 양쪽 모두 적는다. 입장 뒤 이익의 겹침을 나눈다. 첫 제안을 누가 던질지 정하고 흔들 정보를 준비한다. 순서와 범위를 미리 정한다.", "kind": "close", "title": "앉기 전 점검"}], "source_line": "Roger Fisher · William Ury (1981) Getting to Yes / Adam D. Galinsky · Thomas Mussweiler (2001) First Offers as Anchors"}, "col_id": "LR-P-002", "col_type": "대립형", "date": "2026-09-30", "kicker": "연구 노트 · 소통", "summary": {"headline": "테이블에 앉기 전에 결과는 기울어진다", "keypoints": ["입장은 충돌해도 이익은 양립할 수 있다.", "첫 제안의 숫자는 최종 합의를 강하게 예측한다.", "어긋나는 정보에 주의를 돌리면 닻의 힘이 사라진다.", "누가 언제 첫 숫자를 던질지 앉기 전에 정한다."], "lede": "협상 논쟁의 핵심은 말을 잘하는가가 아니라 결과가 언제 정해지는가입니다. 한쪽은 이익을 탐색하라 하고, 다른 쪽은 첫 숫자가 판을 정한다고 말합니다. 두 처방은 서로 다른 층을 봅니다.", "pull_quote": "협상은 테이블 위의 탐색이자 테이블 전의 설계다.", "sections": [{"body": "피셔와 유리는 입장을 주고받는 흥정이 현명하지도 효율적이지도 않다고 본다. 사람과 문제를 떼고 이익에 집중하며 이로운 선택지를 만들고 객관적 기준을 고집한다. 입장은 부딪혀도 이익은 겹칠 수 있다.", "h": "이익을 탐색하라"}, {"body": "갈린스키와 무스바일러는 첫 제안의 닻이 결과를 좌우한다고 말한다. 첫 숫자를 던진 쪽이 유리했고 그 숫자는 최종 합의를 강하게 예측했다. 어긋나는 정보에 주의를 돌리면 힘은 사라졌다.", "h": "첫 숫자가 판을 정한다"}, {"body": "앞의 글에서 협상은 테이블 위의 탐색이고, 뒤의 연구에서 협상은 첫 숫자가 던져지는 순간의 설계다. 이익의 발견은 무엇을 나눌지를, 닻의 발견은 누가 정하는지를 설명한다.", "h": "서로 다른 층"}, {"body": "협상 없이 얻을 최선의 대안을 양쪽 모두 적어 둔다. 입장 뒤 이익의 겹침을 나눈다. 첫 제안을 누가 던질지 정하고 흔들 정보를 준비한다. 누가 언제 어떤 순서로 앉을지 미리 정한다.", "h": "앉기 전 점검"}], "sources": ["Roger Fisher · William Ury (1981) Getting to Yes — 단행본", "Adam D. Galinsky · Thomas Mussweiler (2001) First Offers as Anchors — Journal of Personality and Social Psychology"]}, "title": "협상은 말재주가 아니라 판의 설계다"}</script>
<script>
window.TPL={"kpTitle": "핵심 정리", "ledeLabel": "핵심 정의", "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
</script>
