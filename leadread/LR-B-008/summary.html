<script id="col-data" type="application/json">{"byline": "조우성", "cards": {"cards": [{"body": "클레이튼 크리스텐슨《혁신기업의 딜레마》를 읽고 정리한 연구 노트. 1등 기업의 몰락이 무능이 아님을 묻는다. 이 글이 겨누는 것은 결정이 아니라 눈금이다.", "kind": "cover", "small": "연구 노트 · 전략 · 1997", "title": "합리성의 배신이 몰락을 부른다"}, {"body": "존속적 기술은 기존 고객이 원하는 더 크고 빠른 것이고 파괴적 기술은 처음엔 작고 초라하다. 모범 답안에는 새 기술의 자리가 없다. 자리가 없으니 눈에 밟히지 않는다.", "kind": "point", "small": "개념 정의", "title": "두 기술을 나누면"}, {"body": "옳은 일을 하는 것이 곧 틀린 일이다. 최고의 고객을 살피고 수익 높은 곳에 돈을 모을수록 새 기술은 멀어진다. 모범이 눈가리개가 된다. 잘해 온 방식이 발목을 잡는다.", "kind": "quote", "small": "《혁신기업의 딜레마》(1997) · 필자 번역", "title": "저자의 한 줄"}, {"body": "합리가 문을 여는 과정은 조용하다. 회의는 질서 있게 열리고 숫자는 깔끔하게 맞는다. 그래서 더 알아채기 어렵다. 딜레마는 뒤집힌 합리에서 온다. 조용해서 어렵다.", "kind": "point", "small": "적용", "title": "조용한 파멸"}, {"body": "눈가리개를 벗는 일은 고객을 버리는 일이 아니다. 눈금을 하나 더 다는 일이다. 오늘의 손님과 내일의 손님을 함께 보는 눈금이다. 두 눈금이 함께 있어야 한다.", "kind": "point", "small": "한 걸음 더", "title": "눈금 하나 더"}, {"body": "가장 합리적이라는 결정이 누구의 눈금인지 적는다. 주인이 오늘뿐이라면 내일의 문은 어디인지 함께 적는다. 모르는 문이라도 적어 두면 살핀다. 적는 순간 발길이 바뀐다.", "kind": "close", "title": "점검 문장 하나"}], "source_line": "클레이튼 크리스텐슨 (1997) 《혁신기업의 딜레마》 The Innovator's Dilemma"}, "col_id": "LR-B-008", "col_type": "개념정의형", "date": "2026-09-30", "kicker": "연구 노트 · 전략", "summary": {"headline": "모범 답안이 눈가리개가 될 때", "keypoints": ["1등 기업은 잘못해서가 아니라 잘해서 무너진다.", "모범 답안에는 새 기술의 자리가 없다.", "합리가 파멸의 문을 여는 과정은 조용하다.", "옳음의 눈금 주인이 오늘의 손님뿐인지 적어 둔다."], "lede": "크리스텐슨의 《혁신기업의 딜레마》에서 뒤집히는 발견은 몰락의 원인입니다. 1등 기업은 경영을 못해서 무너지지 않았습니다. 이 구분은 옳은 결정의 눈금 주인을 묻습니다.", "pull_quote": "딜레마의 뿌리는 무능이 아니라 합리가 뒤집히는 데 있다.", "sections": [{"body": "존속적 기술은 기존 고객이 원하는 더 크고 빠른 것이고 파괴적 기술은 처음엔 작고 초라하다. 우량 기업은 최고의 고객을 살피고 수익 높은 곳에 돈을 모은다. 모범 답안을 따를수록 새 기술은 눈에 밟히지 않는다.", "h": "두 기술을 나누면"}, {"body": "지금의 손님은 새 기술을 원하지 않고 이익률은 낮으며 시장은 작다. 그래서 외면하는 결정은 완벽하게 합리적이다. 바로 그 합리가 파멸의 문을 연다.", "h": "합리의 문"}, {"body": "이성적인 경영의 셈법은 새 기술 앞에서 독이 된다. 기존 판의 미덕이 새 판의 눈가리개가 된다. 잘해 온 방식이 다음 판의 발목을 잡는다.", "h": "셈법의 독"}, {"body": "무엇이 옳은 결정인가가 아니라 그 옳음이 누구의 눈금인가를 묻는다. 가장 합리적이라는 결정이 누구의 눈금인지 적는다. 눈금이 바뀌면 발길도 바뀐다.", "h": "눈금의 주인"}], "sources": ["클레이튼 크리스텐슨 (1997) 《혁신기업의 딜레마》 The Innovator's Dilemma — 도서"]}, "title": "합리성의 배신이 몰락을 부른다"}</script>
<script>
window.TPL={"kpTitle": "이야기에서 건진 것", "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');

      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');

  }

  if (kps.length) {
    var kp = el('aside', 'kp');

    kps.forEach(function (k, i) {

      li.appendChild(el('span', 'kp-n', pad2(i + 1)));

      if (CFG.checkable) {

        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });

  }

  /* footer */

    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));

    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });

})();
