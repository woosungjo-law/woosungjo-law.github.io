*,*::before,*::after{box-sizing:border-box}

<script id="col-data" type="application/json">{"col_id": "LR-P-214", "title": "리더는 임명되는 게 아니라 지어진다", "col_type": "대립형", "kicker": "리더십 · 인정", "byline": "조우성", "date": "2026-11-27", "summary": {"headline": "직함은 시작이고 인정이 완성이다", "lede": "발령이 떨어졌는데 이끌지 못하는 리더와, 직함 없이 이미 이끄는 사람이 함께 있다. 리더십은 임명의 결과가 아니라 주장과 수여가 맞물려 지어지는 과정이다.", "sections": [{"h": "지어지는 지위", "body": "개인이 리더처럼 행동하고 타인이 리더로 세우는 과정이 맞물린다. 내면화와 관계적 인정, 집단적 추인이 함께 쌓여 정체성이 된다."}, {"h": "층위의 반론", "body": "개인의 도식, 관계의 협상, 집단의 정체성은 서로 다른 메커니즘으로 움직인다. 하나의 과정으로 설명하면 층 사이의 이동이 사라진다."}, {"h": "과정과 층위", "body": "수여의 신호를 먼저 읽고, 그 신호를 층에 맞춰 옮기는 것이 순서다. 과정만 설계하면 신호를 놓치고 층위만 분류하면 움직이지 않는다."}, {"h": "제도가 되는 습관", "body": "반복된 주장과 수여가 습관이 되고 제도가 되어 지위가 실재한다. 발령장은 시작일 뿐이며 매일의 상호작용이 지위를 다시 짓는다."}], "keypoints": ["발령은 시작이고 인정이 완성이다", "주장과 수여가 맞물려 관계가 선명해진다", "어느 층의 정체성인지 먼저 가려라", "선발에 수여를 넣고 층위를 밟는다", "통제 가능한 것은 상호작용의 설계다"], "pull_quote": "좋은 리더는 임명하는 사람이 아니라 수여를 읽는 사람이다.", "sources": ["DeRue \u0026 Ashford (2010) 리더십 정체성 주장-수여 이론", "Epitropaki·Kark·Mainemelis·Lord (2017) 정체성 다층 검토"]}, "cards": {"cards": [{"kind": "cover", "title": "두 개의 리더", "body": "발령을 받고도 이끌지 못하는 사람과 직함 없이 이미 이끄는 사람이 있다. 리더십은 임명의 결과가 아니라 인정이 지어낸 결과다.", "small": "출발점"}, {"kind": "point", "title": "주장과 수여", "body": "개인이 리더처럼 행동하고 타인이 리더로 세운다. 내면화와 관계적 인정, 집단적 추인이 쌓여 정체성이 된다. 주장과 수여가 맞물리면 관계가 선명해진다.", "small": "DeRue \u0026 Ashford (2010)"}, {"kind": "compare", "title": "과정과 층위", "body": "과정: 주장과 수여를 설계한다||층위: 어느 층의 정체성인지 먼저 본다. 같은 질문에 다른 처방이 나온다. 신호를 읽은 뒤 층에 맞춰 옮기는 순서가 필요하다", "small": "Epitropaki 등 (2017)"}, {"kind": "point", "title": "현장의 선발", "body": "작업 능력만 보던 반장 선발에 동료 의견을 넣자 갈렸다. 임명 뒤에는 각오, 첫 대화, 공개 인정을 순서대로 밟게 했다.", "small": "적용"}, {"kind": "close", "title": "수여 읽기", "body": "누가 따르고 누가 외면하는지 이번 주에 적어 보라. 사람을 탓하기 전에 층위와 신호부터 다시 보는 일이 먼저다.", "small": "점검"}], "source_line": "DeRue \u0026 Ashford (2010) · Epitropaki 등 (2017) 토픽 재구성"}}</script>
<script>
window.TPL={"kpTitle": "핵심 정리", "ledeLabel": "핵심 정의", "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
</script>
