<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.85;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p,ol,ul,blockquote{margin:0;padding:0}

.hd{order:1}.pq{order:2}.secs{order:3}.kp{order:4}.ft{order:5}

/* S5 인용사색형 — 본화이트 & 와인 / 중앙 정렬·큰 여백·대형 인용 */
:root{--bg:#f5f1ea;--ink:#2a2226;--mute:#7a6f74;--acc:#6e2b3a;--line:#c9bfb3;--head:"Noto Serif KR","Nanum Myeongjo",serif;--body:"Noto Serif KR","Nanum Myeongjo",serif;--sans:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15111a;--ink:#e9e2e6;--mute:#a1949b;--acc:#d3919f;--line:#3a2f3c}}

.page{max-width:660px;padding:56px 24px 100px;text-align:center}
.kicker{display:block;font-weight:500}
.headline{font-weight:400;font-size:clamp(16px,3vw,19px);line-height:1.6;color:var(--mute);letter-spacing:0;margin-top:14px}

.pq{order:2;margin:56px -4px 56px;padding:0;position:relative}
.pq::before{content:"\201C";display:block;font-family:var(--head);font-size:96px;line-height:.7;color:var(--acc);opacity:.85;margin-bottom:14px;font-weight:400}
.pq p{font-weight:300;font-size:clamp(23px,5.6vw,38px);line-height:1.6;letter-spacing:-.02em;color:var(--ink)}
.pq::after{content:"";display:block;width:36px;height:1px;background:var(--acc);margin:42px auto 0}

.sec-body{font-size:16.5px;line-height:2.05}
.sec:not(:last-child)::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--acc);margin:56px auto 0;opacity:.7}
.kp{order:5;margin:20px 0 0;padding:34px 0 0;border-top:1px solid var(--line);text-align:left}
.kp-t{text-align:center;font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.3em;color:var(--acc);margin-bottom:12px}
.kp li{display:flex;gap:14px;padding:10px 0}
.kp-n{flex:none;font-family:var(--sans);font-size:11px;letter-spacing:.1em;color:var(--acc);padding-top:.6em}
.kp-x{font-weight:400;line-height:1.85}
.ft{order:6;margin-top:56px;padding-top:24px;border-top:1px solid var(--line);text-align:center}

@media (min-width:820px){

}

<script id="col-data" type="application/json">{"byline": "조우성", "cards": {"cards": [{"body": "조직이 움직이지 않는 이유를 둘러싼 두 논문의 대립을 정리한 연구 노트. 구조의 설계와 리더의 태도가 서로 다른 층에서 답하는 자리를 함께 묻는다.", "kind": "cover", "small": "연구 노트 · 조직 · 1993 대 2001", "title": "구조를 갖춰도 긴장을 걷어내면 멈춘다"}, {"body": "카첸바흐와 스미스는 함께 일하는 집단과 팀을 나눈다. 집단은 개인 책임의 합에 머물고, 팀은 공유하는 헌신으로 합보다 큰 성과를 낸다. 힘은 규율이 자리 잡았는가에 있다.", "kind": "compare", "small": "경영전문지 대 경영전문지", "title": "설계 대 태도"}, {"body": "인원은 작게 묶고 역량은 보완되게 하며, 공동의 목적을 구체 목표로 바꾸고 방식에 미리 합의하며, 개인과 팀 전체의 책임을 함께 지운다. 카리스마가 아니라 규율이 조직을 움직인다.", "kind": "point", "small": "카첸바흐·스미스(1993)", "title": "힘은 구조에 있다"}, {"body": "기술적 문제는 지식과 절차로 풀리지만, 적응적 과제는 구성원이 스스로 바뀌어야 풀린다. 해답을 대신 제시하면 당장은 조용해지지만 진짜 변화는 오지 않는다.", "kind": "point", "small": "하이페츠·로리(1997, 2001)", "title": "힘은 태도에 있다"}, {"body": "앎은 행위 속에서만 완성된다. 실행을 거치지 않은 지식은 미완의 가설일 뿐이다. 규율은 시행착오를 겪을 구조를 마련하는 일이고, 불균형은 그것을 피하지 못하게 하는 압력이다.", "kind": "point", "small": "듀이의 렌즈", "title": "가설을 들고 행동에 뛰어든다"}, {"body": "규율이 벽의 도표가 아니라 되풀이되는 행동인지를 본다. 해답을 말하고 싶을 때 질문으로 바꾸고, 불편한 데이터를 안건 맨 앞에 둔다. 관행은 행동이 반복된 자리에만 생긴다.", "kind": "close", "title": "먼저 점검할 것은 관행이다"}], "source_line": "Katzenbach \u0026 Smith (1993) · Heifetz \u0026 Laurie (1997, 2001)"}, "col_id": "LR-P-008", "col_type": "대립형", "date": "2026-09-30", "kicker": "연구 노트 · 조직", "summary": {"headline": "설계는 아래층이고 태도는 위층이다", "keypoints": ["카첸바흐와 스미스는 규율의 설계가 헌신을 뒤따라오게 한다고 본다.", "하이페츠와 로리는 긴장을 유지하는 리더의 태도가 필요하다고 본다.", "설계는 아래층이고 태도는 위층으로, 서로 다른 층의 답이다.", "관행은 리더의 행동이 반복된 자리에만 생긴다."], "lede": "조직이 멈추는 이유를 두고 한쪽은 구조의 설계를, 다른 쪽은 리더의 태도를 말한다. 두 처방을 겹쳐 읽으면 아래층과 위층이 함께 있어야 움직임이 나온다.", "pull_quote": "조직의 관행은 리더의 행동이 반복된 자리에만 생긴다.", "sections": [{"body": "카첸바흐와 스미스는 함께 일하는 집단과 팀을 나눈다. 팀은 공유하는 헌신으로 합보다 큰 성과를 내며, 힘은 규율이 자리 잡았는가에 있다.", "h": "힘은 구조에 있다"}, {"body": "하이페츠와 로리는 문제를 기술적 문제와 적응적 과제로 나눈다. 적응적 과제는 구성원이 스스로 바뀌어야 풀리며, 해답을 대신 주면 진짜 변화는 오지 않는다.", "h": "힘은 태도에 있다"}, {"body": "설계는 아래층이고 태도는 위층이다. 아래층만 있으면 조직은 서 있지만 어디로도 가지 않는다. 서로 다른 층을 본 것으로 읽힌다.", "h": "서로 다른 층"}, {"body": "규율이 도표가 아니라 되풀이되는 행동인지를 보고, 해답 대신 질문을 건네며, 불편한 데이터를 앞에 둔다. 관행은 반복된 행동의 자리에만 생긴다.", "h": "먼저 점검할 것은 관행이다"}], "sources": ["Jon R. Katzenbach \u0026 Douglas K. Smith (1993) The Discipline of Teams — Harvard Business Review", "Ronald A. Heifetz \u0026 Donald L. Laurie (1997, 2001) The Work of Leadership — Harvard Business Review"]}, "title": "구조를 갖춰도 긴장을 걷어내면 멈춘다"}</script>
<script>
window.TPL={"kpTitle": "남겨 둘 문장", "splitLede": true, "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
</script>
