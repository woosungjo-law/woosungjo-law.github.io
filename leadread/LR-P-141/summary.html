: "한쪽은 승자를 가려 물을 대는 심판으로, 다른 쪽은 평화를 사느라 패자에게 돈을 대는 중재자로 본다. 고르되 새는 돈이 얼마인지 함께 재야 한다.", "small": "두 논문이 갈리는 곳"}, {"kind": "close", "title": "점검 세 가지", "body": "본사가 심판인지 중재자인지 가린다. 사업부 사이의 기회 격차를 잰다. 안 되는 사업으로 흐르는 돈을 계산하고, 평화의 값이 가치보다 비싸지면 묶음을 푼다.", "small": "바로 쓸 점검"}], "source_line": "Stein (1997) · Rajan 등 (2000) 재구성"}}</script>
<script>
