<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.85;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p,ol,ul,blockquote{margin:0;padding:0}
ol,ul{list-style:none}
.page{display:flex;flex-direction:column;margin:0 auto;width:100%}
.hd{order:1}.pq{order:2}.secs{order:3}.kp{order:4}.ft{order:5}
.kicker{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--acc)}
.headline{font-family:var(--head);word-break:keep-all;text-wrap:balance}
.meta{font-family:var(--sans);font-size:13px;color:var(--mute);letter-spacing:.02em}
.meta .dot{margin:0 .55em;opacity:.6}
.sec-body p+p{margin-top:.9em}
.ft{font-family:var(--sans);font-size:13px;line-height:1.7;color:var(--mute)}
.ft h3{font-size:12px;letter-spacing:.14em;font-weight:600;margin-bottom:6px;color:var(--ink)}
.ft .src li{padding-left:1em;text-indent:-1em}
.ft .src li::before{content:"· "}
.ft .disc{margin-top:18px}
.ft .by{margin-top:4px;color:var(--ink);font-weight:600}
a{color:inherit}
@media (prefers-reduced-motion:no-preference){.page>*{animation:rise .5s ease both}.page>*:nth-child(2){animation-delay:.05s}.page>*:nth-child(3){animation-delay:.1s}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* S2 개념정의형 — 딥네이비 & 골드 / 사전식 좌우 배치 */
:root{--bg:#f3f4f7;--ink:#141f38;--mute:#5d6577;--acc:#8f6a12;--gold:#c9a24b;--navy:#0f1c3a;--head:"Noto Serif KR","Nanum Myeongjo",serif;--body:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif;--sans:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1122;--ink:#e6e9f1;--mute:#9aa3b8;--acc:#d8b25e;--navy:#0f1c3a}}
body{font-size:16.5px;line-height:1.85}
.page{max-width:none;padding:0}
.hd{background:var(--navy);color:#f1eee4;padding:44px 20px 40px}
.hd>*{max-width:900px;margin-left:auto;margin-right:auto}
.kicker{display:block;color:var(--gold);margin-bottom:16px}
.headline{font-weight:700;font-size:clamp(26px,5.6vw,46px);line-height:1.34;letter-spacing:-.015em;color:#fff}
.lede{margin-top:26px;padding:20px 20px 20px 22px;border-left:3px solid var(--gold);background:rgba(255,255,255,.06)}
.lede-label{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.16em;font-weight:700;color:var(--gold);margin-bottom:8px}
.lede p{font-size:clamp(16px,2.3vw,18.5px);line-height:1.85;color:#ece9de}
.meta{margin-top:20px;color:#a9b2c7}
.pq,.secs,.ft{width:100%;max-width:900px;margin-left:auto;margin-right:auto;padding-left:20px;padding-right:20px}
.pq{margin-top:44px}
.pq p{font-family:var(--head);font-weight:600;font-size:clamp(19px,3.2vw,26px);line-height:1.6;color:var(--ink);padding:4px 0 4px 20px;border-left:3px solid var(--gold)}
.secs{margin-top:34px}
.sec{padding:26px 0;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}
.sec:first-child{border-top:0}
.sec .num{display:block;font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--acc);margin-bottom:6px}
.sec h2{font-family:var(--head);font-weight:700;font-size:clamp(19px,3.2vw,23px);line-height:1.45;margin-bottom:12px;color:var(--ink)}
.kp{background:var(--navy);color:#eee;margin-top:20px;padding:34px 20px 38px}
.kp>*{max-width:860px;margin-left:auto;margin-right:auto}
.kp-t{font-family:var(--head);font-size:20px;font-weight:700;color:var(--gold);margin-bottom:14px}
.kp li{display:flex;gap:14px;padding:12px 0;border-top:1px solid rgba(255,255,255,.14)}
.kp li:first-child{border-top:0}
.kp-n{flex:none;width:9px;height:9px;margin-top:.72em;background:var(--gold);transform:rotate(45deg);font-size:0;overflow:hidden}
.kp-x{line-height:1.7;color:#eef0f5}
.ft{padding-top:32px;padding-bottom:72px}
@media (min-width:820px){
  .hd{padding:80px 40px 64px}
  .pq,.secs,.ft{padding-left:40px;padding-right:40px}
  .kp{padding:52px 40px 56px}
  .sec{display:grid;grid-template-columns:230px 1fr;column-gap:44px;padding:34px 0}
  .sec .num{grid-column:1;grid-row:1;margin:0 0 4px;align-self:start}
  .sec .sec-in{display:contents}
  .sec h2{grid-column:1;grid-row:1;margin:26px 0 0}
  .sec-body{grid-column:2;grid-row:1/span 2;font-size:17px}
}
</style>
</head>

<noscript><p style="padding:24px">이 페이지는 JavaScript가 필요합니다.</p></noscript>
<script id="col-data" type="application/json">{"byline": "조우성", "cards": {"cards": [{"body": "로버트 치알디니《설득의 심리학》을 읽고 정리한 연구 노트. 내 판단이 정말 내 것인지 묻는다. 이 글이 던지는 것은 수가 아니라 근거다. 여럿의 손을 보는 눈을 묻는다.", "kind": "cover", "small": "연구 노트 · 소통 · 1984", "title": "불확실할수록 타인을 본다"}, {"body": "어떤 아이디어를 옳다고 여기는 사람의 수가 많을수록, 그 아이디어는 더 옳을 것이다. 지름길은 빠르다는 뜻이지 옳다는 뜻이 아니다. 빠름과 옳음의 착각에서 조종이 시작된다.", "kind": "quote", "small": "《설득의 심리학》(1984) · 필자 번역", "title": "치알디니의 한 줄"}, {"body": "모두가 오른다 믿어 더 사들이면 거품이 큰다. 따르는 판단이 하나씩 쌓여 부풀린다. 쌓이는 동안에는 누구도 부풀린다고 느끼지 않는다. 군중을 따르면 군중이 커진다.", "kind": "point", "small": "낯선 관찰", "title": "부풀리는 거품"}, {"body": "남의 행동으로 재빨리 가늠하는 일은 오래 살아남은 방식이다. 그러나 빠른 길은 틀린 길일 수 있다. 모두가 같은 쪽을 보면 시야는 좁아진다. 빠른 길을 파는 사람들이 끝에 서 있다.", "kind": "point", "small": "한 걸음 더", "title": "살아남은 방식"}, {"body": "수를 세는 일은 쉽고 근거를 묻는 일은 어렵다. 쉬운 쪽으로 기울 때 판단은 남의 것이 된다. 전자는 수를 세고 후자는 근거를 묻는다. 확인할 한 줄이 없으면 아직 내 판단이 아니다.", "kind": "point", "small": "전환", "title": "수와 근거"}, {"body": "인기 표시 앞에서 한 호흡 멈춘다. 멈춘 틈에 근거 한 줄을 묻고 없으면 결정을 다음으로 미룬다. 기다리는 동안 근거를 모으면 다음은 내 것이다. 미룬 결정은 기다려 준다.", "kind": "close", "title": "점검 문장 하나"}], "source_line": "로버트 치알디니 (1984) 《설득의 심리학》 Influence"}, "col_id": "LR-B-009", "col_type": "인용사색형", "date": "2026-09-30", "kicker": "연구 노트 · 소통", "summary": {"headline": "수를 세기 전에 근거를 묻는다", "keypoints": ["불확실할수록 타인의 행동이 판단 지름길이 된다.", "빠르다는 뜻이 옳다는 뜻은 아니다.", "따르는 판단이 쌓여 거품을 부풀린다.", "인기 표시 앞에서 한 호흡 멈추고 근거를 묻는다."], "lede": "치알디니의 《설득의 심리학》에서 먼저 흔들리는 믿음은 내 판단에 관한 것입니다. 스스로 따져 정한다고 믿지만 자주 그렇지 않습니다. 이 관찰은 여럿의 손을 보는 눈을 묻습니다.", "pull_quote": "많은 사람이 고른 것이라 해서 근거까지 딸려 오지는 않는다.", "sections": [{"body": "어떤 아이디어를 옳다고 여기는 사람이 많을수록 더 옳을 것이라 느낀다. 불확실한 상황에서 타인의 행동은 가장 빠른 판단 지름길이 된다. 빠름과 옳음의 착각에서 조종이 시작된다.", "h": "한 줄의 관찰"}, {"body": "모두가 오른다 믿어 더 사들이면 거품이 큰다. 군중을 따르는 판단이 모여 군중을 더 크게 만든다. 사회적 증거의 힘을 알면 따르기 전에 멈출 틈을 얻는다.", "h": "부풀리는 거품"}, {"body": "남의 행동으로 가늠하는 일은 오래 살아남은 방식이다. 그러나 빠른 길은 틀린 길일 수 있다. 모두가 같은 쪽을 볼 때 시야는 넓어지는 대신 좁아진다.", "h": "살아남은 방식"}, {"body": "남들이 뭐라 하는가가 아니라 내가 무엇을 확인했는가를 묻는다. 인기 표시 앞에서 한 호흡 멈춘다. 멈춘 틈에 근거 한 줄을 묻고 없으면 결정을 미룬다.", "h": "묻는 질문"}], "sources": ["로버트 치알디니 (1984) 《설득의 심리학》 Influence — 도서"]}, "title": "불확실할수록 타인을 본다"}</script>
<script>
window.TPL={"kpTitle": "핵심 정리", "ledeLabel": "핵심 정의", "srcTitle": "출처"};
(function () {
  var CFG = window.TPL || {};
  var root = document.getElementById('root');
  var D;
  try {
    D = JSON.parse(document.getElementById('col-data').textContent);
  } catch (e) {
    root.textContent = '데이터를 불러오지 못했습니다. (템플릿 단독 열람 시 정상)';
    return;
  }
  var S = D.summary || {};
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null && x !== '') e.textContent = x;
    return e;
  }
  function ok(v) { return typeof v === 'string' && v.trim().length > 0; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function paras(parent, text) {
    String(text || '').split(/\n+/).forEach(function (p) {
      if (p.trim()) parent.appendChild(el('p', null, p.trim()));
    });
  }
  var secs = Array.isArray(S.sections) ? S.sections.filter(function (s) { return s && (ok(s.h) || ok(s.body)); }) : [];
  var kps = Array.isArray(S.keypoints) ? S.keypoints.filter(ok) : [];
  var srcs = Array.isArray(S.sources) ? S.sources.filter(ok) : [];
  var headline = ok(S.headline) ? S.headline : (D.title || '');
  var by = ok(D.byline) ? D.byline : '조우성';
  var date = ok(D.date) ? D.date.replace(/-/g, '.') : '';

  var chars = (S.lede || '').length;
  secs.forEach(function (s) { chars += (s.h || '').length + (s.body || '').length; });
  kps.forEach(function (k) { chars += k.length; });
  var mins = Math.max(1, Math.round(chars / 550));

  /* header */
  var hd = el('header', 'hd');
  if (ok(D.kicker)) hd.appendChild(el('p', 'kicker', D.kicker));
  hd.appendChild(el('h1', 'headline', headline));
  if (ok(S.lede)) {
    var lede = el('div', 'lede');
    if (CFG.ledeLabel) lede.appendChild(el('span', 'lede-label', CFG.ledeLabel));
    lede.appendChild(el('p', null, S.lede.trim()));
    if (CFG.splitLede) { lede.classList.add('lede-x'); root.appendChild(lede); } else { hd.appendChild(lede); }
  }
  var meta = el('p', 'meta');
  var parts = [by];
  if (date) parts.push(date);
  parts.push('읽는 시간 약 ' + mins + '분');
  parts.forEach(function (t, i) {
    if (i) meta.appendChild(el('span', 'dot', '·'));
    meta.appendChild(el('span', null, t));
  });
  hd.appendChild(meta);
  root.appendChild(hd);

  /* pull quote */
  if (ok(S.pull_quote)) {
    var pq = el('blockquote', 'pq');
    pq.appendChild(el('p', null, S.pull_quote.trim()));
    root.appendChild(pq);
  }

  /* sections */
  if (secs.length) {
    var wrap = el('section', 'secs');
    secs.forEach(function (s, i) {
      var sec = el('article', 'sec');
      sec.appendChild(el('span', 'num', pad2(i + 1)));
      var box = el('div', 'sec-in');
      if (ok(s.h)) box.appendChild(el('h2', null, s.h.trim()));
      var b = el('div', 'sec-body');
      paras(b, s.body);
      box.appendChild(b);
      sec.appendChild(box);
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  /* keypoints */
  if (kps.length) {
    var kp = el('aside', 'kp');
    kp.appendChild(el('h2', 'kp-t', CFG.kpTitle || '핵심 정리'));
    var ol = el('ol');
    kps.forEach(function (k, i) {
      var li = el('li');
      li.appendChild(el('span', 'kp-n', pad2(i + 1)));
      li.appendChild(el('span', 'kp-x', k.trim()));
      if (CFG.checkable) {
        li.tabIndex = 0;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        var tg = function () {
          var on = li.getAttribute('aria-checked') !== 'true';
          li.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        li.addEventListener('click', tg);
        li.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tg(); }
        });
      }
      ol.appendChild(li);
    });
    kp.appendChild(ol);
    root.appendChild(kp);
  }

  /* footer */
  var ft = el('footer', 'ft');
  if (srcs.length) {
    var sd = el('div', 'src');
    sd.appendChild(el('h3', null, CFG.srcTitle || '출처'));
    var ul = el('ul');
    srcs.forEach(function (s) { ul.appendChild(el('li', null, s.trim())); });
    sd.appendChild(ul);
    ft.appendChild(sd);
  }
  ft.appendChild(el('p', 'disc', '독서·연구 노트이며 법률·투자 자문이 아닙니다.'));
  ft.appendChild(el('p', 'by', by + (date ? ' · ' + date : '')));
  root.appendChild(ft);
  document.body.setAttribute('data-ready', '1');
})();
</script>
